# Systematic review as an Atomic Task Graph (research type: systematic_review).
# Generated once from the scoping-review board, then maintained by hand. Same rules: edges are derived
# from `in`/`out`; `optional` inputs may be absent; loop bodies stay inside their loop.
# Validate: agsci board check src/systematic_review/board.yaml
meta:
  title: Systematic review — atomic task graph
  research_type: systematic_review
  version: 1
  summary: End-to-end systematic review (interventions, with notes for diagnostic and prognostic reviews) from question to publication. Reuses the scoping
    lanes for search, screening, writing and submission; adds dual extraction, risk of bias, meta-analysis or SWiM synthesis, and GRADE. An AI is one of
    the two independent reviewers at screening, extraction and risk of bias, with a human second reviewer and human resolution of every disagreement.
  givens: []
  thresholds:
    pilot_ta_sample:
      value: 25
      unit: records
      source: JBI Manual 10.2.7.1 https://jbi-global.atlassian.net/wiki/spaces/MANUAL/pages/2049540102
    pilot_ta_agreement:
      value: 0.75
      unit: proportion
      source: JBI Manual 10.2.7.1 (start full screening only at >= 75% agreement)
    seed_recall:
      value: 0.9
      unit: proportion
      source: project choice; reported, not a published standard
    al_trigger_records:
      value: 3000
      unit: records
      source: project choice; stopping rule = SAFE (Boetje & van de Schoot 2024, Syst Rev 13:81)
    search_age_months:
      value: 12
      unit: months
      source: MECIR C37 (re-run within 12 months of publication, 6 preferred)
    dedup_check_pairs:
      value: 50
      unit: merged pairs
      source: project choice
    review_rounds:
      value: 3
      unit: rounds
      source: project choice (fold cycles introduce regressions; mays/013 history)
    pilot_extract_agreement:
      value: 0.8
      unit: proportion of fields
      source: project choice; MECIR C43 requires piloting, not a number
    min_studies_funnel:
      value: 10
      unit: studies
      source: Cochrane Handbook v6.5 ch. 13
    min_studies_per_subgroup_characteristic:
      value: 10
      unit: studies
      source: Cochrane Handbook v6.5 10.11.5.1
    min_studies_prediction_interval:
      value: 5
      unit: studies
      source: Cochrane Handbook v6.5 ch. 10
    max_sof_outcomes:
      value: 7
      unit: outcomes
      source: Cochrane Handbook v6.5 14.1.3; MECIR C52
    rare_event_rate:
      value: 0.01
      unit: proportion
      source: Cochrane Handbook v6.5 10.4.4 (Peto OR below 1%)
  paths:
    topic_idea: review/topic.md
    prior_reviews: review/prior_reviews.json
    dup_decision: review/decisions.yaml#P0.03
    pcc_draft: review/pcc.md
    review_type_decision: review/decisions.yaml#P0.05
    pcc_final: review/pcc.md
    team: review/team.yaml
    librarian_decision: review/decisions.yaml#P0.08
    journal_shortlist: review/journal_shortlist.yaml
    journal_choice: review/journal_choice.yaml
    journal_profile: review/journal_profile.yaml
    reporting_std: review/decisions.yaml#P1.04
    tex_template: manuscript/
    eligibility: review/eligibility.md
    term_list: review/terms.yaml
    seed_set: review/seed_set.bib
    search_strings: review/search/primary.txt
    primary_strategy: review/search/primary.txt
    test_run: review/search/test_run.json
    press_report: review/search/press.md
    search_strings_rev: review/search/primary.txt
    search_final: review/search/
    charting_form_v0: review/charting_form.yaml
    ai_reviewer_spec: review/ai_reviewer.yaml
    protocol: review/protocol.md
    protocol_reviewed: review/protocol.md
    protocol_review: review/reviews/protocol_{iter}.md
    protocol_rev: review/protocol.md
    protocol_frozen: review/protocol.md
    protocol_pub_decision: review/decisions.yaml#P3.01
    osf_registration: review/registration.yaml
    protocol_submission: review/registration.yaml
    deviations_log: review/ledger.jsonl
    raw_records: review/records/raw/
    search_log: review/search_log.json
    grey_decision: review/decisions.yaml#P4.02
    grey_records: review/records/raw/grey.jsonl
    records_dedup: review/records/dedup.jsonl
    dedup_log: review/records/dedup_log.json
    dedup_ok: review/records/dedup_check.jsonl
    al_decision: review/decisions.yaml#P4.06
    screening_guide: review/screening_guide.md
    screening_guide_final: review/screening_guide.md
    calibration_report: review/screen/calibration.json
    pilot_sample: review/screen/pilot_{iter}.jsonl
    human_pilot: review/screen/human_pilot_{iter}.jsonl
    ai_pilot: review/screen/ai_pilot_{iter}.jsonl
    pilot_agreement: review/screen/pilot_agreement_{iter}.json
    guide_rev: review/screening_guide.md
    ai_ta: review/screen/ai_ta.jsonl
    human_ta: review/screen/human_ta.jsonl
    ta_conflicts: review/screen/ta_conflicts.jsonl
    ta_kappa: review/screen/ta_agreement.json
    ta_decisions: review/screen/ta_final.jsonl
    ta_included: review/screen/ta_included.jsonl
    fulltext_oa: review/fulltext/
    retrieval_log: review/fulltext/retrieval_log.json
    fulltext_manual: review/fulltext/manual/
    not_retrieved: review/fulltext/not_retrieved.jsonl
    fulltext_md: review/fulltext_md/
    ai_ft: review/screen/ai_ft.jsonl
    human_ft: review/screen/human_ft.jsonl
    ft_conflicts: review/screen/ft_conflicts.jsonl
    ft_kappa: review/screen/ft_agreement.json
    ft_decisions: review/screen/ft_final.jsonl
    chase_included: review/chase/included.jsonl
    chase_log: review/chase/log.json
    chase_candidates: review/chase/candidates_{iter}.jsonl
    chase_new: review/chase/new_{iter}.jsonl
    chase_ai: review/chase/ai_{iter}.jsonl
    chase_round: review/chase/final_{iter}.jsonl
    included_final: review/included.jsonl
    prisma_counts: review/prisma_counts.json
    charting_form_final: review/charting_form.yaml
    ai_chart: review/extract/ai.jsonl
    chart_verified: review/extract/final.jsonl
    chart_frozen: review/extract/final.jsonl
    stats: review/synthesis/stats.json
    synthesis: review/synthesis/synthesis.md
    claims_ledger: review/synthesis/claims_grounding.json
    fig_prisma: manuscript/figures/prisma.pdf
    tab_characteristics: manuscript/tables/characteristics.tex
    figures_final: manuscript/figures/
    figure_audit: review/figures/audit_{iter}.md
    figures_rev: manuscript/figures/
    synthesis_ok: review/synthesis/audit.json
    outline: manuscript/outline.md
    sec_methods: manuscript/sections/methods.tex
    sec_results: manuscript/sections/results.tex
    sec_intro: manuscript/sections/introduction.tex
    sec_discussion: manuscript/sections/discussion.tex
    sec_conclusion: manuscript/sections/conclusion.tex
    sec_abstract: manuscript/sections/abstract.tex
    sec_declarations: manuscript/sections/declarations.tex
    supplement: manuscript/supplement/
    ms_v1: manuscript/
    grounding_ok_v1: review/audit/grounding_v1.json
    refs_included: manuscript/refs_included.bib
    refs_background: manuscript/refs_background.bib
    references: manuscript/references.bib
    ref_report: review/refs/integrity.md
    retraction_report: review/refs/retractions.json
    citation_support: review/refs/citation_support.md
    refs_ok: review/refs/ok.json
    ms_dev: manuscript/
    ms_flow: manuscript/
    ms_sentence: manuscript/
    ms_voice: manuscript/
    ms_edited: manuscript/
    edit_ok: review/audit/edit.json
    ms_reviewed: manuscript/
    review_ledger: review/reviews/ledger.yaml
    review_journal: review/reviews/round_{iter}/referee.md
    review_codex: review/reviews/round_{iter}/codex.md
    ms_folded: manuscript/
    fold_check: review/reviews/round_{iter}/recheck.json
    author_approval: review/approvals.yaml
    ms_typeset_src: manuscript/
    ms_pdf: manuscript/main.pdf
    compile_log: manuscript/main.log
    latex_fix: manuscript/
    inspect_report: review/layout/inspect.md
    visual_report: review/layout/visual.md
    limits_decision: review/decisions.yaml#P13.05
    ms_trimmed: manuscript/
    trim_edit: manuscript/
    trim_check: review/layout/limits_{iter}.json
    layout_ok: review/layout/ok.json
    numbers_report: review/proof/numbers.txt
    proof_auto: review/proof/auto.md
    proof_ai: review/proof/ai.md
    proof_human: review/proof/human.md
    reporting_checklist: manuscript/supplement/reporting_checklist.pdf
    ms_final: manuscript/main.pdf
    update_decision: review/decisions.yaml#P15.01
    ms_updated: manuscript/main.pdf
    cover_letter: submission/cover_letter.tex
    reviewer_suggestions: submission/reviewers.yaml
    highlights: submission/highlights.txt
    preprint_decision: review/decisions.yaml#P15.06
    preprint_doi: review/registration.yaml
    data_deposit: review/registration.yaml
    outbox_package: submission/package/
    submission_record: review/submission.yaml
    decision_letter: review/journal/decision_{iter}.md
    editorial_decision: review/decisions.yaml#P16.02
    ms_accepted_rev: manuscript/main.pdf
    response_matrix: review/journal/response_{iter}.yaml
    triage: review/journal/response_{iter}.yaml
    ms_revised: manuscript/
    response_letter: review/journal/response_letter_{iter}.tex
    resubmission: review/submission.yaml
    ms_accepted_fallback: manuscript/main.pdf
    ms_retargeted: manuscript/
    fallback_submission: review/submission.yaml
    proofs_approved: review/journal/proofs.md
    osf_final: review/registration.yaml
    archive_manifest: review/archive_manifest.json
    published: review/submission.yaml
    search_lint_ok: review/search/lint.json
    prospero_decision: review/decisions.yaml#P3.05
    registry_records: review/records/raw/registers.jsonl
    extract_pilot: review/extract/pilot_{iter}/
    extract_pilot_agreement: review/extract/pilot_agreement_{iter}.json
    extract_form_rev: review/charting_form.yaml
    human_extract: review/extract/human.jsonl
    extract_agreement: review/extract/agreement.json
    missing_data_decision: review/decisions.yaml#S7.06
    author_responses: review/extract/author_contacts.md
    numbers_checked: review/extract/crosscheck.md
    included_retractions: review/extract/retractions.json
    rob_tool: review/decisions.yaml#RB.01
    rob_ai: review/rob/ai.json
    rob_human: review/rob/human.json
    rob_conflicts: review/rob/conflicts.json
    rob_final: review/rob/final.json
    rob_overall: review/rob/overall.json
    fig_rob: manuscript/figures/rob.pdf
    rob_ok: review/rob/signoff.md
    ma_decision: review/decisions.yaml#S9.01
    ma_method: review/decisions.yaml#S9.02
    meta_results: review/synthesis/meta/
    fig_forest: manuscript/figures/forest/
    subgroup_decision: review/decisions.yaml#S9.05
    subgroup_results: review/synthesis/subgroups/
    sensitivity_results: review/synthesis/sensitivity/
    funnel_decision: review/decisions.yaml#S9.08
    fig_funnel: manuscript/figures/funnel/
    egger_results: review/synthesis/egger.json
    swim_synthesis: review/synthesis/swim.md
    grade_assessments: review/synthesis/grade.json
    tab_sof: manuscript/tables/sof.tex
    grade_ok: review/synthesis/grade_check.json
lanes:
- id: P0
  name: Topic and go/no-go
- id: P1
  name: Journal targeting
- id: P2
  name: Protocol and search design
- id: P3
  name: Registration
- id: P4
  name: Search execution
- id: P5
  name: Title/abstract screening
- id: P6
  name: Full-text screening
- id: S7
  name: Data extraction
- id: RB
  name: Risk of bias
- id: S9
  name: Synthesis and meta-analysis
- id: GR
  name: Certainty of evidence (GRADE)
- id: P9
  name: Drafting
- id: P10
  name: References
- id: P11
  name: Editing
- id: P12
  name: Internal review
- id: P13
  name: Typesetting and layout
- id: P14
  name: Proofreading
- id: P15
  name: Submission
- id: P16
  name: Peer review and revision
- id: P17
  name: Publication and archiving
nodes:
- id: P0.01
  lane: P0
  kind: task
  title: Choose the review topic
  exec: human
  impl: human
  run: 'write review/topic.md (one paragraph: phenomenon, why now, intended users)'
  out:
  - topic_idea
- id: P0.02
  lane: P0
  kind: task
  title: Search for existing reviews and registered protocols
  exec: agent
  impl: exists
  skill: sr-prior-reviews
  mode: search
  run: agsci board run src/systematic_review/board.yaml P0.02 --root <project>
  in:
  - topic_idea
  out:
  - prior_reviews
- id: P0.03
  lane: P0
  kind: decision
  title: Does an existing or ongoing review already answer this?
  exec: ai+human
  impl: human
  run: review review/prior_reviews.json; record choice in review/decisions.yaml#P0.03
  options:
  - continue
  - stop
  criterion: stop if a published or registered review covers the same PCC within the last 3 years; continue with a stated differentiation otherwise
  in:
  - prior_reviews
  out:
  - dup_decision
- id: P0.04
  lane: P0
  kind: task
  title: Draft PICO (or PECO/PIRD), objective and review questions
  exec: agent
  impl: exists
  skill: sr-question
  mode: pico
  when: P0.03 == continue
  run: agsci board run src/systematic_review/board.yaml P0.04 --root <project>
  in:
  - topic_idea
  - prior_reviews
  - dup_decision
  out:
  - pcc_draft
- id: P0.05
  lane: P0
  kind: decision
  title: Is a systematic review the right review type?
  exec: ai+human
  impl: human
  run: check review/pcc.md against the Munn et al. 2018 indications; record in review/decisions.yaml#P0.05
  options:
  - systematic
  - scoping
  - other
  criterion: systematic when the aim is an effect, accuracy or prognostic estimate from comparable studies; scoping when the aim is to map evidence (route
    to the scoping_review board); other when too few comparable studies or no team for dual review
  in:
  - pcc_draft
  out:
  - review_type_decision
- id: P0.06
  lane: P0
  kind: gate
  title: PICO and questions approved
  exec: human
  impl: human
  when: P0.05 == systematic
  run: 'lead reviewer signs review/pcc.md (status: approved)'
  approver: lead reviewer
  criterion: each question names population, intervention or exposure, comparator and outcomes (MECIR C1-C13)
  in:
  - pcc_draft
  - review_type_decision
  out:
  - pcc_final
- id: P0.07
  lane: P0
  kind: task
  title: Assemble team and roles (CRediT)
  exec: human
  impl: human
  run: write review/team.yaml (lead, adjudicator, librarian if any, co-authors, CRediT roles)
  in:
  - pcc_final
  out:
  - team
- id: P0.08
  lane: P0
  kind: decision
  title: Is a librarian or information specialist available?
  exec: human
  impl: human
  run: record in review/decisions.yaml#P0.08
  options:
  - 'yes'
  - 'no'
  criterion: yes if a named person will do PRESS peer review of the search
  in:
  - team
  out:
  - librarian_decision
- id: P1.01
  lane: P1
  kind: task
  title: Build journal shortlist with requirement profiles
  exec: agent
  impl: exists
  skill: sr-journals
  mode: shortlist
  run: agsci board run src/systematic_review/board.yaml P1.01 --root <project>
  in:
  - pcc_final
  out:
  - journal_shortlist
- id: P1.02
  lane: P1
  kind: decision
  title: Choose primary and fallback journals
  exec: human
  impl: human
  run: edit review/journal_choice.yaml (primary + 2 ordered fallbacks)
  options:
  - accept_top_ranked
  - choose_other
  criterion: scope fit, accepts scoping reviews, AI-use policy allows a disclosed AI second reviewer, OA/APC acceptable
  in:
  - journal_shortlist
  out:
  - journal_choice
- id: P1.03
  lane: P1
  kind: task
  title: Compile the journal profile
  exec: script
  impl: exists
  run: agsci sr journal-profile --shortlist review/journal_shortlist.yaml --choice review/journal_choice.yaml --out review/journal_profile.yaml
  in:
  - journal_choice
  out:
  - journal_profile
- id: P1.04
  lane: P1
  kind: decision
  title: Reporting guideline
  exec: ai+human
  impl: human
  run: record in review/decisions.yaml#P1.04
  options:
  - prisma_2020
  - prisma_dta
  criterion: PRISMA 2020 (27 items + 12-item abstract checklist); PRISMA-DTA for diagnostic accuracy reviews
  in:
  - journal_profile
  out:
  - reporting_std
- id: P1.05
  lane: P1
  kind: task
  title: Fetch the journal LaTeX template, class and bibliography style
  exec: script
  impl: exists
  run: 'agsci sr template --profile review/journal_profile.yaml --out manuscript/  (no template URL in the profile: keep the article draft from P9.10 until
    one is found)'
  in:
  - journal_profile
  out:
  - tex_template
- id: P2.01
  lane: P2
  kind: task
  title: Draft eligibility criteria
  exec: agent
  impl: exists
  skill: sr-question
  mode: eligibility
  run: agsci board run src/systematic_review/board.yaml P2.01 --root <project>
  in:
  - pcc_final
  out:
  - eligibility
- id: P2.02
  lane: P2
  kind: task
  title: Build concept blocks and term list
  exec: agent
  impl: exists
  skill: sr-search-design
  mode: terms
  run: agsci board run src/systematic_review/board.yaml P2.02 --root <project>
  in:
  - pcc_final
  - prior_reviews
  out:
  - term_list
- id: P2.03
  lane: P2
  kind: task
  title: Assemble the seed set of known-relevant papers
  exec: ai+human
  impl: exists
  skill: sr-search-design
  mode: seeds
  run: 'agsci board run src/systematic_review/board.yaml P2.03 --root <project>  # AI drafts; a person reviews, then agsci board done'
  in:
  - pcc_final
  out:
  - seed_set
- id: P2.04
  lane: P2
  kind: task
  title: Draft the primary search strategy (one database)
  exec: agent
  impl: exists
  skill: sr-search-design
  mode: primary
  run: agsci board run src/systematic_review/board.yaml P2.04 --root <project>
  in:
  - term_list
  - eligibility
  out:
  - search_strings
- id: P2.05
  lane: P2
  kind: loop
  title: Refine the primary strategy until PRESS-clean and seed recall met
  exec: ai+human
  impl: exists
  run: agsci board start ... P2.05; run body P2.05a-c; agsci board iterate ... P2.05 --note <guard result> until the guard holds, then agsci board done
    ... P2.05
  guard: PRESS report has 0 'revision required' items and seed recall >= thresholds.seed_recall
  bound: 3
  progress: PRESS revision items + missed seeds
  body:
  - P2.05a
  - P2.05b
  - P2.05c
  in:
  - search_strings
  - seed_set
  - librarian_decision
  out:
  - primary_strategy
- id: P2.05a
  parent: P2.05
  lane: P2
  kind: task
  title: Run test searches and measure seed recall
  exec: script
  impl: exists
  run: agsci sr test-search --strategy review/search/primary.txt --source <primary source> --seeds review/seed_set.bib --out review/search/test_run.json
  in:
  - search_strings
  - seed_set
  out:
  - test_run
- id: P2.05b
  parent: P2.05
  lane: P2
  kind: task
  title: PRESS 2015 peer review of the search
  exec: ai+human
  impl: exists
  skill: sr-search-design
  mode: press
  run: 'agsci board run src/systematic_review/board.yaml P2.05b --root <project>  # AI drafts; a person reviews, then agsci board done'
  in:
  - test_run
  - librarian_decision
  out:
  - press_report
- id: P2.05c
  parent: P2.05
  lane: P2
  kind: task
  title: Revise search strings
  exec: agent
  impl: exists
  skill: sr-search-design
  mode: revise
  run: agsci board run src/systematic_review/board.yaml P2.05c --root <project>
  in:
  - press_report
  - test_run
  out:
  - search_strings_rev
- id: P2.06
  lane: P2
  kind: task
  title: Draft the data extraction form (outcome data + characteristics)
  exec: agent
  impl: exists
  skill: sr-protocol
  mode: extraction-form
  run: agsci board run src/systematic_review/board.yaml P2.06 --root <project>
  in:
  - pcc_final
  - eligibility
  out:
  - charting_form_v0
- id: P2.07
  lane: P2
  kind: task
  title: Specify the AI second reviewer for screening, extraction and risk of bias
  exec: agent
  impl: exists
  skill: sr-protocol
  mode: ai-reviewer
  run: agsci board run src/systematic_review/board.yaml P2.07 --root <project>
  in:
  - eligibility
  out:
  - ai_reviewer_spec
- id: P2.08
  lane: P2
  kind: task
  title: Write the protocol (PRISMA-P; methods fixed per MECIR C19-C23)
  exec: agent
  impl: exists
  skill: sr-protocol
  mode: protocol-sr
  run: agsci board run src/systematic_review/board.yaml P2.08 --root <project>
  in:
  - pcc_final
  - eligibility
  - search_final
  - charting_form_v0
  - ai_reviewer_spec
  - reporting_std
  - team
  - search_lint_ok
  out:
  - protocol
- id: P2.09
  lane: P2
  kind: loop
  title: Internal protocol review
  exec: ai+human
  impl: exists
  run: loop over P2.09a-b
  guard: review returns 0 major findings
  bound: 3
  progress: major findings
  body:
  - P2.09a
  - P2.09b
  in:
  - protocol
  out:
  - protocol_reviewed
- id: P2.09a
  parent: P2.09
  lane: P2
  kind: task
  title: Adversarial protocol review
  exec: skill
  impl: exists
  run: /scientific-reviewer --format=journal review/protocol.md
  in:
  - protocol
  out:
  - protocol_review
- id: P2.09b
  parent: P2.09
  lane: P2
  kind: task
  title: Fold review findings into the protocol
  exec: agent
  impl: exists
  skill: sr-fold
  mode: fold
  run: agsci board run src/systematic_review/board.yaml P2.09b --root <project>
  in:
  - protocol_review
  out:
  - protocol_rev
- id: P2.10
  lane: P2
  kind: gate
  title: Protocol frozen
  exec: human
  impl: human
  run: authors approve; agsci sr freeze review/protocol.md --ledger review/ledger.jsonl --node P2.10
  approver: all authors
  criterion: every author approves; hash recorded
  in:
  - protocol_reviewed
  out:
  - protocol_frozen
- id: P2.11
  lane: P2
  kind: task
  title: Translate the PRESS-reviewed strategy to every other source
  exec: agent
  impl: exists
  skill: sr-search-design
  mode: translate
  run: agsci board run src/systematic_review/board.yaml P2.11 --root <project>
  in:
  - primary_strategy
  - eligibility
  out:
  - search_final
- id: P2.12
  lane: P2
  kind: task
  title: Search strategy rule check (no NOT operator, controlled vocabulary present)
  exec: script
  impl: exists
  run: agsci sysrev search-lint review/search/ --out review/search/lint.json
  in:
  - search_final
  out:
  - search_lint_ok
- id: P3.01
  lane: P3
  kind: decision
  title: Also publish the protocol in a journal?
  exec: human
  impl: human
  run: record in review/decisions.yaml#P3.01
  options:
  - 'yes'
  - 'no'
  criterion: yes if the target journal expects a published protocol (e.g. JBI Evidence Synthesis) and the timeline allows it
  in:
  - protocol_frozen
  - journal_profile
  out:
  - protocol_pub_decision
- id: P3.02
  lane: P3
  kind: task
  title: Register the protocol (PROSPERO if eligible, else OSF) before extraction
  exec: human
  impl: human
  run: PROSPERO when P3.05 == yes, else OSF Registries; record the registration number in review/registration.yaml
  in:
  - protocol_frozen
  - prospero_decision
  out:
  - osf_registration
- id: P3.03
  lane: P3
  kind: task
  title: Submit the protocol paper
  exec: human
  impl: human
  when: P3.01 == yes
  run: submit review/protocol.md to the protocol venue; record ID in review/registration.yaml
  in:
  - protocol_frozen
  - protocol_pub_decision
  out:
  - protocol_submission
- id: P3.04
  lane: P3
  kind: task
  title: Open the deviations log
  exec: script
  impl: exists
  run: agsci sr freeze review/protocol.md --ledger review/ledger.jsonl --node P3.04 && agsci sr freeze review/registration.yaml --ledger review/ledger.jsonl
    --node P3.04
  in:
  - protocol_frozen
  - osf_registration
  out:
  - deviations_log
- id: P3.05
  lane: P3
  kind: decision
  title: Is the review eligible for PROSPERO (an outcome relevant to human health)?
  exec: human
  impl: human
  run: record in review/decisions.yaml#P3.05
  options:
  - 'yes'
  - 'no'
  criterion: yes registers on PROSPERO before data extraction starts (from Oct 2019 rule); no registers on OSF Registries
  in:
  - protocol_frozen
  out:
  - prospero_decision
- id: P4.01
  lane: P4
  kind: task
  title: Run database searches with PRISMA-S log
  exec: script
  impl: exists
  run: 'agsci sr search --strings review/search/ --out review/records/raw/ --log review/search_log.json (all 16 PRISMA-S items)  # ports mays/013 harvest_multisource.py
    + glp1_brca multi_source_search.py'
  in:
  - search_final
  - osf_registration
  - search_lint_ok
  out:
  - raw_records
  - search_log
- id: P4.02
  lane: P4
  kind: decision
  title: Is grey literature in scope?
  exec: human
  impl: human
  run: read protocol section 'Sources'; record in review/decisions.yaml#P4.02
  options:
  - 'yes'
  - 'no'
  criterion: as fixed in the frozen protocol
  in:
  - protocol_frozen
  out:
  - grey_decision
- id: P4.03
  lane: P4
  kind: task
  title: Search grey literature
  exec: ai+human
  impl: exists
  skill: sr-search-design
  mode: grey
  when: P4.02 == yes
  run: 'agsci board run src/systematic_review/board.yaml P4.03 --root <project>  # AI drafts; a person reviews, then agsci board done'
  in:
  - search_final
  - grey_decision
  out:
  - grey_records
- id: P4.04
  lane: P4
  kind: task
  title: Deduplicate records
  exec: script
  impl: exists
  run: agsci sr dedup --in review/records/ --out review/records/dedup.json --log review/records/dedup_log.json
  in:
  - raw_records
  - grey_records
  - registry_records
  optional:
  - grey_records
  - registry_records
  out:
  - records_dedup
  - dedup_log
- id: P4.05
  lane: P4
  kind: gate
  title: Deduplication spot-check
  exec: human
  impl: exists
  run: agsci sr dedup-sample --log review/records/dedup_log.json --n 50 --out review/records/dedup_check.jsonl → human sets false_merge on every row (all
    version pairs first)
  approver: lead reviewer
  criterion: 0 false merges in thresholds.dedup_check_pairs random merged pairs
  in:
  - dedup_log
  out:
  - dedup_ok
- id: P4.06
  lane: P4
  kind: decision
  title: Use active-learning prioritization for screening?
  exec: ai+human
  impl: human
  run: record in review/decisions.yaml#P4.06
  options:
  - 'yes'
  - 'no'
  criterion: 'yes when records > thresholds.al_trigger_records; stop by SAFE: all seeds found, >= 2x estimated relevant prevalence and >= 10% screened,
    last 50 irrelevant, model switch, independent check of exclusions; disclose and log as a deviation if not in the protocol'
  in:
  - records_dedup
  - dedup_ok
  out:
  - al_decision
- id: P4.07
  lane: P4
  kind: task
  title: Search trial registers (ClinicalTrials.gov and WHO ICTRP, separately)
  exec: ai+human
  impl: exists
  skill: sr-search-design
  mode: registers
  run: agsci board run src/systematic_review/board.yaml P4.07 --root <project>
  when: P3.05 == yes
  in:
  - search_final
  - prospero_decision
  - osf_registration
  out:
  - registry_records
- id: P5.01
  lane: P5
  kind: task
  title: Write the screening guide with worked examples
  exec: agent
  impl: exists
  skill: sr-screen
  mode: guide
  run: agsci board run src/systematic_review/board.yaml P5.01 --root <project>
  in:
  - eligibility
  - protocol_frozen
  out:
  - screening_guide
- id: P5.02
  lane: P5
  kind: loop
  title: Calibrate human and AI screeners on a pilot sample
  exec: ai+human
  impl: exists
  run: agsci board start ... P5.02; run body P5.02a-e; agsci board iterate ... P5.02 --note <guard result> until the guard holds, then agsci board done
    ... P5.02
  guard: agreement >= thresholds.pilot_ta_agreement on thresholds.pilot_ta_sample records
  bound: 3
  progress: disagreements on the pilot sample
  body:
  - P5.02a
  - P5.02b
  - P5.02c
  - P5.02d
  - P5.02e
  in:
  - records_dedup
  - screening_guide
  - ai_reviewer_spec
  out:
  - screening_guide_final
  - calibration_report
- id: P5.02a
  parent: P5.02
  lane: P5
  kind: task
  title: Draw a seeded random pilot sample
  exec: script
  impl: exists
  run: agsci sr sample --in review/records/dedup.json --n 25 --seed <iteration> --out review/screen/pilot.json
  in:
  - records_dedup
  out:
  - pilot_sample
- id: P5.02b
  parent: P5.02
  lane: P5
  kind: task
  title: Human screens the pilot
  exec: human
  impl: exists
  run: agsci sr sheet screen --in review/screen/pilot_{iter}.jsonl --out review/screen/human_pilot_{iter}.csv → fill → agsci sr sheet import-screen --sheet
    ... --stage pilot --screener <initials> --codes-from review/eligibility.md --out review/screen/human_pilot_{iter}.jsonl
  in:
  - pilot_sample
  - screening_guide
  out:
  - human_pilot
- id: P5.02c
  parent: P5.02
  lane: P5
  kind: task
  title: AI screens the pilot independently
  exec: agent
  impl: exists
  skill: sr-screen
  mode: screen
  run: agsci board run src/systematic_review/board.yaml P5.02c --root <project>
  in:
  - pilot_sample
  - screening_guide
  - ai_reviewer_spec
  out:
  - ai_pilot
- id: P5.02d
  parent: P5.02
  lane: P5
  kind: task
  title: Compute agreement and Cohen's kappa
  exec: script
  impl: exists
  run: agsci sr agreement --a review/screen/human_pilot.csv --b review/screen/ai_pilot.csv
  in:
  - human_pilot
  - ai_pilot
  out:
  - pilot_agreement
- id: P5.02e
  parent: P5.02
  lane: P5
  kind: task
  title: Refine guide and AI prompt (log any criteria change as a deviation)
  exec: ai+human
  impl: exists
  skill: sr-screen
  mode: refine
  run: 'agsci board run src/systematic_review/board.yaml P5.02e --root <project>  # AI drafts; a person reviews, then agsci board done'
  in:
  - pilot_agreement
  out:
  - guide_rev
- id: P5.03
  lane: P5
  kind: task
  title: AI screens all titles/abstracts (reason + quoted span)
  exec: agent
  impl: exists
  skill: sr-screen
  mode: screen
  run: agsci board run src/systematic_review/board.yaml P5.03 --root <project>
  in:
  - records_dedup
  - screening_guide_final
  - ai_reviewer_spec
  out:
  - ai_ta
- id: P5.04
  lane: P5
  kind: task
  title: Human screens all titles/abstracts
  exec: human
  impl: exists
  run: agsci sr sheet screen --in review/records/dedup.jsonl --out review/screen/human_ta.csv → fill (active-learning order + SAFE stop when P4.06 == yes)
    → agsci sr sheet import-screen --stage ta ... --out review/screen/human_ta.jsonl
  in:
  - records_dedup
  - screening_guide_final
  - al_decision
  out:
  - human_ta
- id: P5.05
  lane: P5
  kind: task
  title: Compare screeners, compute kappa, build conflict queue
  exec: script
  impl: exists
  run: agsci sr agreement --a review/screen/human_ta.csv --b review/screen/ai_ta.csv --conflicts review/screen/ta_conflicts.csv
  in:
  - ai_ta
  - human_ta
  out:
  - ta_conflicts
  - ta_kappa
- id: P5.06
  lane: P5
  kind: task
  title: Adjudicate title/abstract conflicts
  exec: human
  impl: exists
  run: agsci sr sheet adjudicate --in review/screen/ta_conflicts.jsonl --records review/records/dedup.jsonl --out review/screen/ta_adjudicate.csv → fill
    → agsci sr finalize --a review/screen/human_ta.jsonl --b review/screen/ai_ta.jsonl --adjudicated review/screen/ta_adjudicate.csv --stage ta --adjudicator
    <initials> --codes-from review/eligibility.md --out review/screen/ta_final.jsonl
  in:
  - ta_conflicts
  out:
  - ta_decisions
- id: P5.07
  lane: P5
  kind: gate
  title: Title/abstract screening complete
  exec: script
  impl: exists
  run: agsci sr check-stage ta
  approver: adjudicator
  criterion: every record has a final decision, 0 unresolved conflicts, kappa recorded
  in:
  - ta_decisions
  - ta_kappa
  - records_dedup
  out:
  - ta_included
- id: P6.01
  lane: P6
  kind: task
  title: Retrieve open-access full texts
  exec: script
  impl: exists
  run: agsci sr fetch-fulltext --in review/screen/ta_included.jsonl --out review/fulltext/ --log review/fulltext/retrieval_log.json
  in:
  - ta_included
  out:
  - fulltext_oa
  - retrieval_log
- id: P6.02
  lane: P6
  kind: task
  title: Retrieve paywalled full texts (library / ILL)
  exec: human
  impl: human
  run: work through review/fulltext/missing.csv; drop PDFs in review/fulltext/manual/
  in:
  - retrieval_log
  out:
  - fulltext_manual
  - not_retrieved
- id: P6.03
  lane: P6
  kind: task
  title: Convert PDFs to text
  exec: script
  impl: exists
  run: gpu-run --class batch --mem 8192 --reason 'docling fulltext' -- agsci sr convert review/fulltext/ review/fulltext/manual/ --out review/fulltext_md/
  in:
  - fulltext_oa
  - fulltext_manual
  out:
  - fulltext_md
- id: P6.04
  lane: P6
  kind: task
  title: AI full-text screen (reason code + page-cited quote)
  exec: agent
  impl: exists
  skill: sr-screen
  mode: screen
  run: agsci board run src/systematic_review/board.yaml P6.04 --root <project>
  in:
  - fulltext_md
  - screening_guide_final
  - ai_reviewer_spec
  out:
  - ai_ft
- id: P6.05
  lane: P6
  kind: task
  title: Human full-text screen
  exec: human
  impl: exists
  run: agsci sr sheet screen --in review/screen/ta_included.jsonl --out review/screen/human_ft.csv → fill from the full texts → agsci sr sheet import-screen
    --stage ft ... --out review/screen/human_ft.jsonl
  in:
  - fulltext_md
  - screening_guide_final
  out:
  - human_ft
- id: P6.06
  lane: P6
  kind: task
  title: Compare full-text screeners, kappa, conflicts
  exec: script
  impl: exists
  run: agsci sr agreement --a review/screen/human_ft.csv --b review/screen/ai_ft.csv --conflicts review/screen/ft_conflicts.csv
  in:
  - ai_ft
  - human_ft
  out:
  - ft_conflicts
  - ft_kappa
- id: P6.07
  lane: P6
  kind: task
  title: Adjudicate full-text conflicts
  exec: human
  impl: exists
  run: agsci sr sheet adjudicate --in review/screen/ft_conflicts.jsonl ... → fill → agsci sr finalize --stage ft ... --out review/screen/ft_final.jsonl
  in:
  - ft_conflicts
  out:
  - ft_decisions
- id: P6.08
  lane: P6
  kind: loop
  title: Citation chasing (backward and forward)
  exec: ai+human
  impl: exists
  run: agsci board start ... P6.08; run body P6.08a-d; agsci board iterate ... P6.08 --note <guard result> until the guard holds, then agsci board done
    ... P6.08
  guard: a round adds 0 newly included sources
  bound: 3
  progress: newly included sources per round
  body:
  - P6.08a
  - P6.08b
  - P6.08c
  - P6.08d
  in:
  - ft_decisions
  - records_dedup
  - screening_guide_final
  - ai_reviewer_spec
  out:
  - chase_included
  - chase_log
- id: P6.08a
  parent: P6.08
  lane: P6
  kind: task
  title: Collect references and citing works of included sources
  exec: script
  impl: exists
  run: agsci sr chase --included review/screen/ft_final.jsonl --out review/chase/candidates_{iter}.jsonl  (trace review/chase/candidates_{iter}.unresolved.txt
    by hand)
  in:
  - ft_decisions
  out:
  - chase_candidates
- id: P6.08b
  parent: P6.08
  lane: P6
  kind: task
  title: Deduplicate candidates against the corpus
  exec: script
  impl: exists
  run: agsci sr dedup --against review/records/dedup.json --in review/chase/candidates.json
  in:
  - chase_candidates
  - records_dedup
  out:
  - chase_new
- id: P6.08c
  parent: P6.08
  lane: P6
  kind: task
  title: AI screens chased records (TA + FT)
  exec: agent
  impl: exists
  skill: sr-screen
  mode: screen
  run: agsci board run src/systematic_review/board.yaml P6.08c --root <project>
  in:
  - chase_new
  - screening_guide_final
  - ai_reviewer_spec
  out:
  - chase_ai
- id: P6.08d
  parent: P6.08
  lane: P6
  kind: task
  title: Human screens and adjudicates chased records
  exec: human
  impl: exists
  run: agsci sr sheet screen --in review/chase/new_{iter}.jsonl ... → import-screen --stage chase → agsci sr agreement + sheet adjudicate + finalize --stage
    chase --out review/chase/final_{iter}.jsonl
  in:
  - chase_ai
  - chase_new
  out:
  - chase_round
- id: P6.09
  lane: P6
  kind: gate
  title: Included set frozen; PRISMA counts balance
  exec: script
  impl: exists
  run: agsci sr check-stage ft ... && agsci sr prisma --search-log review/search_log.json --dedup-log review/records/dedup_log.json --ta-report review/screen/ta_report.json
    --ft-report review/screen/ft_report.json --not-retrieved <n> --out review/prisma_counts.json
  approver: adjudicator
  criterion: identified - duplicates - excluded = included at every stage; every FT exclusion has a reason code
  in:
  - ft_decisions
  - chase_included
  - chase_log
  - ta_included
  - not_retrieved
  - dedup_log
  - search_log
  out:
  - included_final
  - prisma_counts
- id: S7.01
  lane: S7
  kind: loop
  title: Pilot the extraction form
  exec: ai+human
  impl: exists
  run: agsci board start ... S7.01; run body S7.01a-c; agsci board iterate ... S7.01 --note <guard result> until the guard holds, then agsci board done
    ... S7.01
  guard: human and AI agree on >= thresholds.pilot_extract_agreement of fields on 3 included studies
  bound: 3
  progress: disagreeing fields
  body:
  - S7.01a
  - S7.01b
  - S7.01c
  in:
  - charting_form_v0
  - included_final
  - fulltext_md
  out:
  - charting_form_final
- id: S7.01a
  lane: S7
  kind: task
  title: Human and AI extract the pilot studies independently
  exec: ai+human
  impl: exists
  skill: sysrev-extract
  mode: extract
  run: agsci board run src/systematic_review/board.yaml S7.01a --root <project>
  parent: S7.01
  in:
  - charting_form_v0
  - included_final
  - fulltext_md
  out:
  - extract_pilot
- id: S7.01b
  lane: S7
  kind: task
  title: Compare field-level agreement
  exec: script
  impl: exists
  run: agsci sr chart-agreement --a review/extract/pilot_{iter}/human.jsonl --b review/extract/pilot_{iter}/ai.jsonl --out review/extract/pilot_agreement_{iter}.json
  parent: S7.01
  in:
  - extract_pilot
  out:
  - extract_pilot_agreement
- id: S7.01c
  lane: S7
  kind: task
  title: Revise the extraction form
  exec: ai+human
  impl: exists
  skill: sr-protocol
  mode: revise-form
  run: agsci board run src/systematic_review/board.yaml S7.01c --root <project>
  parent: S7.01
  in:
  - extract_pilot_agreement
  out:
  - extract_form_rev
- id: S7.02
  lane: S7
  kind: task
  title: AI extracts outcome data and characteristics (quote + page per value)
  exec: agent
  impl: exists
  skill: sysrev-extract
  mode: extract
  run: agsci board run src/systematic_review/board.yaml S7.02 --root <project>
  in:
  - included_final
  - fulltext_md
  - charting_form_final
  - osf_registration
  out:
  - ai_chart
- id: S7.03
  lane: S7
  kind: task
  title: Human extracts outcome data independently (MECIR C46)
  exec: human
  impl: exists
  run: agsci sysrev extract-sheet --form review/charting_form.yaml --studies review/included.jsonl --out review/extract/human.csv, fill it without seeing
    the AI values, then agsci sysrev extract-import --sheet review/extract/human.csv --extractor <initials> --out review/extract/human.jsonl
  in:
  - included_final
  - fulltext_md
  - charting_form_final
  - osf_registration
  out:
  - human_extract
- id: S7.04
  lane: S7
  kind: task
  title: Compare the two extractions
  exec: script
  impl: exists
  run: agsci sr chart-agreement --a review/extract/human.jsonl --b review/extract/ai.jsonl --out review/extract/agreement.json
  in:
  - ai_chart
  - human_extract
  out:
  - extract_agreement
- id: S7.05
  lane: S7
  kind: task
  title: Resolve every disagreement against the report
  exec: human
  impl: exists
  run: agsci sysrev reconcile --a review/extract/human.jsonl --b review/extract/ai.jsonl --out review/extract/conflicts.csv, resolve each row against the
    report, then agsci sysrev reconcile --a review/extract/human.jsonl --b review/extract/ai.jsonl --resolved review/extract/conflicts.csv --resolver <initials>
    --out review/extract/final.jsonl
  in:
  - extract_agreement
  - ai_chart
  - human_extract
  out:
  - chart_verified
- id: S7.06
  lane: S7
  kind: decision
  title: Is key outcome data missing from any report?
  exec: ai+human
  impl: human
  run: record in review/decisions.yaml#S7.06
  options:
  - 'yes'
  - 'no'
  criterion: yes when an included study lacks data needed for a planned synthesis (never exclude for that alone, MECIR C40)
  in:
  - chart_verified
  out:
  - missing_data_decision
- id: S7.07
  lane: S7
  kind: task
  title: Contact study authors for missing data (MECIR C49)
  exec: human
  impl: human
  run: email corresponding authors; log every request and reply in review/extract/author_contacts.md
  when: S7.06 == yes
  in:
  - missing_data_decision
  out:
  - author_responses
- id: S7.08
  lane: S7
  kind: task
  title: Check effect size and direction against each report (MECIR C51)
  exec: ai+human
  impl: exists
  skill: sysrev-extract
  mode: crosscheck
  run: agsci board run src/systematic_review/board.yaml S7.08 --root <project>
  in:
  - chart_verified
  - fulltext_md
  out:
  - numbers_checked
- id: S7.09
  lane: S7
  kind: task
  title: Check included studies for retractions and errata (MECIR C48)
  exec: script
  impl: exists
  run: agsci sr bib --included review/included.jsonl --out review/extract/included.bib --keys review/extract/keys.json && agsci sr retractions --bib review/extract/included.bib
    --out review/extract/retractions.json
  in:
  - included_final
  out:
  - included_retractions
- id: S7.10
  lane: S7
  kind: gate
  title: Extraction dataset frozen
  exec: script
  impl: exists
  run: agsci sr freeze review/extract/final.jsonl --ledger review/ledger.jsonl --node S7.10
  criterion: every outcome value extracted twice and reconciled, checked against the report, no retracted study unflagged; hash recorded
  approver: lead reviewer
  in:
  - chart_verified
  - numbers_checked
  - included_retractions
  - author_responses
  - deviations_log
  optional:
  - author_responses
  out:
  - chart_frozen
- id: RB.01
  lane: RB
  kind: decision
  title: Risk-of-bias tool for the included designs
  exec: human
  impl: human
  run: record in review/decisions.yaml#RB.01
  options:
  - rob2
  - robins_i_v2
  - quadas2
  - quips
  criterion: RoB 2 for randomized trials (takes precedence, C58); ROBINS-I V2 for non-randomized interventions (draft as of 2025-11-20); QUADAS-2 for diagnostic
    accuracy; QUIPS for prognostic factors
  in:
  - protocol_frozen
  - chart_frozen
  out:
  - rob_tool
- id: RB.02
  lane: RB
  kind: task
  title: AI assesses risk of bias per result (judgement + supporting quote per domain)
  exec: agent
  impl: exists
  skill: sysrev-rob
  mode: assess
  run: agsci board run src/systematic_review/board.yaml RB.02 --root <project>
  in:
  - rob_tool
  - chart_frozen
  - fulltext_md
  out:
  - rob_ai
- id: RB.03
  lane: RB
  kind: task
  title: Human assesses risk of bias independently (C53)
  exec: human
  impl: exists
  run: agsci sysrev rob-sheet --tool <RB.01 option> --studies review/included.jsonl --out review/rob/human.csv → fill → agsci sysrev rob-import ... --out
    review/rob/human.json
  in:
  - rob_tool
  - chart_frozen
  - fulltext_md
  out:
  - rob_human
- id: RB.04
  lane: RB
  kind: task
  title: Compare the two assessments
  exec: script
  impl: exists
  run: agsci sysrev rob-compare --tool <RB.01 option> --a review/rob/human.json --b review/rob/ai.json --out review/rob/conflicts.json
  in:
  - rob_ai
  - rob_human
  out:
  - rob_conflicts
- id: RB.05
  lane: RB
  kind: task
  title: Reach consensus on every disagreement, with support and source (C54-C55)
  exec: human
  impl: exists
  run: edit review/rob/final.json from review/rob/conflicts.json; every judgement keeps its quote and page
  in:
  - rob_conflicts
  out:
  - rob_final
- id: RB.06
  lane: RB
  kind: task
  title: Overall judgements and traffic-light figure
  exec: script
  impl: exists
