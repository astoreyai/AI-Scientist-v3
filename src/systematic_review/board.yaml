- id: S9.01
  lane: S9
  kind: decision
  title: Is meta-analysis appropriate (MECIR C62)?
  exec: ai+human
  impl: human
  run: record in review/decisions.yaml#S9.01
  options:
  - 'yes'
  - 'no'
  criterion: yes only when participants, interventions, comparisons and outcomes are sufficiently similar and >= 2 studies report the outcome; else a structured
    synthesis reported with SWiM
  in:
  - chart_frozen
  - protocol_frozen
  - rob_ok
  out:
  - ma_decision
- id: S9.02
  lane: S9
  kind: decision
  title: Pooling method
  exec: ai+human
  impl: human
  run: record in review/decisions.yaml#S9.02
  when: S9.01 == yes
  options:
  - reml_hksj
  - mantel_haenszel
  - peto
  criterion: REML random effects with HKSJ when tau2 > 0 and k > 2 (Cochrane v6.5 ch. 10); Peto OR when events < 1%; Mantel-Haenszel for other sparse binary
    data
  in:
  - ma_decision
  - chart_frozen
  out:
  - ma_method
