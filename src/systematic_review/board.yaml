  title: Within journal limits (words, abstract, figures, tables, refs)?
  exec: script
  impl: exists
  run: 'agsci sr limits --tex manuscript/main.tex --profile review/journal_profile.yaml  # exit 1 = no'
  options:
  - 'yes'
  - 'no'
  criterion: every count at or under the journal profile limit
  in:
  - ms_pdf
  - journal_profile
  out:
  - limits_decision
- id: P13.06
  lane: P13
  kind: loop
  title: Trim to limits
  exec: ai+human
  impl: exists
  when: P13.05 == no
  run: agsci board start ... P13.06; run body P13.06a-b; agsci board iterate ... P13.06 --note <guard result> until the guard holds, then agsci board done
    ... P13.06
  guard: agsci sr limits exits 0
  bound: 3
  progress: words over limit
  body:
  - P13.06a
  - P13.06b
  in:
  - ms_pdf
  - limits_decision
  - journal_profile
  out:
  - ms_trimmed
- id: P13.06a
  parent: P13.06
  lane: P13
  kind: task
  title: Move detail to supplement or condense (author approves cuts)
  exec: ai+human
  impl: exists
  skill: sr-latex
  mode: trim
  run: 'agsci board run src/systematic_review/board.yaml P13.06a --root <project>  # AI drafts; a person reviews, then agsci board done'
  in:
  - ms_pdf
  - journal_profile
  out:
  - trim_edit
- id: P13.06b
  parent: P13.06
  lane: P13
  kind: task
  title: Recompile and recount
  exec: script
  impl: exists
  run: bash src/agents/skills/validate-paper/scripts/compile_latex.sh manuscript/main.tex && agsci sr limits --tex manuscript/main.tex --profile review/journal_profile.yaml
  in:
  - trim_edit
  out:
  - trim_check
- id: P13.07
  lane: P13
  kind: gate
  title: Layout clean
  exec: script
  impl: exists
  run: agsci sr check-layout --pdf manuscript/main.pdf && test -s review/layout/inspect.md && test -s review/layout/visual.md  (0 blocking findings in both,
    limits decision yes or trimmed)
  approver: lead reviewer
  criterion: 0 blocking inspection findings, all fonts embedded, within limits
  in:
  - inspect_report
  - visual_report
  - limits_decision
  - ms_trimmed
  optional:
  - ms_trimmed
  out:
  - layout_ok
- id: P14.01
  lane: P14
  kind: task
  title: Numbers consistency (flow diagram = abstract = results = tables)
  exec: script
  impl: exists
  run: agsci sr check-numbers --pdf manuscript/main.pdf --counts review/prisma_counts.json
  in:
  - layout_ok
  - prisma_counts
  - stats
  out:
  - numbers_report
- id: P14.02
  lane: P14
  kind: task
  title: Automated proof checks (cross-refs, numbering, acronyms, spelling)
  exec: script
  impl: exists
  run: agsci sr proof-auto --tex manuscript --wordlist manuscript/wordlist.txt --out review/proof/auto.md
  in:
  - layout_ok
  out:
  - proof_auto
- id: P14.03
  lane: P14
  kind: task
  title: AI proofread (tracked change list)
  exec: agent
  impl: exists
  skill: sr-proof
  mode: proofread
  run: agsci board run src/systematic_review/board.yaml P14.03 --root <project>
  in:
  - layout_ok
  out:
  - proof_ai
- id: P14.04
  lane: P14
  kind: task
  title: Human proofread of the final PDF
  exec: human
  impl: human
  run: read the PDF aloud against review/proof/ai.md; accept or reject each change
  in:
  - proof_ai
  - proof_auto
  - numbers_report
  out:
  - proof_human
- id: P14.05
  lane: P14
  kind: task
  title: PRISMA 2020 checklist with page numbers
  exec: script
  impl: exists
  run: agsci sr checklist prisma_2020 --map manuscript/reporting_map.yaml --aux manuscript/main.aux --out manuscript/supplement/reporting_checklist.pdf
  in:
  - layout_ok
  - reporting_std
  out:
  - reporting_checklist
- id: P14.06
  lane: P14
  kind: gate
  title: Proof complete
  exec: human
  impl: human
  run: lead author signs review/proof/signoff.md
  approver: lead author
  criterion: 0 open proof items, numbers consistent, checklist complete when required
  in:
  - proof_human
  - numbers_report
  - reporting_checklist
  optional: []
  out:
  - ms_final
- id: P15.01
  lane: P15
  kind: decision
  title: Is the search older than the freshness limit?
  exec: script
  impl: exists
  run: 'agsci sr search-age --log review/search_log.json --max-months 12 --on <planned submission date>  # exit 1 = yes'
  options:
  - 'yes'
  - 'no'
  criterion: yes if the last search date is more than thresholds.search_age_months before planned submission
  in:
  - search_log
  - ms_final
  out:
  - update_decision
- id: P15.02
  lane: P15
  kind: task
  title: Update the search and integrate new sources
  exec: ai+human
  impl: exists
  when: P15.01 == yes
  run: agsci sr search --strategies review/search --since <last search date> --out review/update/raw --log review/update/search_log.json && agsci sr dedup
    review/update/raw --against review/records/dedup.jsonl --out review/update/new.jsonl --log review/update/dedup_log.json, then screen, chart and synthesise
    the new records with the same commands (sheet/agreement/finalize/check-stage/chart/describe), recompute prisma, and re-run gates from P9.11
  in:
  - update_decision
  - search_final
  - ms_final
  out:
  - ms_updated
- id: P15.03
  lane: P15
  kind: task
  title: Cover letter
  exec: agent
  impl: exists
  skill: sr-submission
  mode: cover-letter
  run: agsci board run src/systematic_review/board.yaml P15.03 --root <project>
  in:
  - ms_final
  - journal_profile
  out:
  - cover_letter
- id: P15.04
  lane: P15
  kind: task
  title: Suggested and opposed reviewers (no conflicts of interest)
  exec: ai+human
  impl: exists
  skill: sr-submission
  mode: reviewers
  run: 'agsci board run src/systematic_review/board.yaml P15.04 --root <project>  # AI drafts; a person reviews, then agsci board done'
  in:
  - references
  - journal_profile
  out:
  - reviewer_suggestions
- id: P15.05
  lane: P15
  kind: task
  title: Highlights / key points
  exec: agent
  impl: exists
  skill: sr-submission
  mode: highlights
  run: agsci board run src/systematic_review/board.yaml P15.05 --root <project>
  in:
  - ms_final
  - journal_profile
  out:
  - highlights
- id: P15.06
  lane: P15
  kind: decision
  title: Post a preprint?
  exec: human
  impl: human
  run: check journal preprint policy; record in review/decisions.yaml#P15.06
  options:
  - 'yes'
  - 'no'
  criterion: journal permits preprints and the authors want one
  in:
  - journal_profile
  - ms_final
  out:
  - preprint_decision
- id: P15.07
  lane: P15
  kind: task
  title: Post the preprint
  exec: human
  impl: human
  when: P15.06 == yes
  run: upload to arXiv / OSF Preprints; record DOI
  in:
  - preprint_decision
  - ms_final
  out:
  - preprint_doi
- id: P15.08
  lane: P15
  kind: task
  title: Deposit review data on the OSF project
  exec: human
  impl: human
  run: upload search strings, search log, dedup log, screening decisions (human + AI), charting dataset, code
  in:
  - osf_registration
  - chart_frozen
  - search_log
  - dedup_log
  - ta_decisions
  - ft_decisions
  out:
  - data_deposit
- id: P15.09
  lane: P15
  kind: task
  title: Stage the submission package in Outbox
  exec: script
  impl: exists
  run: agsci sr package manuscript/main.pdf manuscript/supplement submission/cover_letter.tex submission/reviewers.yaml [submission/highlights.txt] --out
    ~/Desktop/Outbox/<YYYY-MM-DD>_<slug>/  (review-pending; nothing is sent)
  in:
  - ms_final
  - ms_updated
  - cover_letter
  - reviewer_suggestions
  - highlights
  - reporting_checklist
  - supplement
  - data_deposit
  optional:
  - ms_updated
  out:
  - outbox_package
- id: P15.10
  lane: P15
  kind: gate
  title: Submit
  exec: human
  impl: human
  run: corresponding author submits via the journal system; record manuscript ID in review/submission.yaml
  approver: corresponding author
  criterion: all authors approved the final package
  in:
  - outbox_package
  - author_approval
  out:
  - submission_record
- id: P16.01
  lane: P16
  kind: task
  title: Record the editorial decision letter
  exec: human
  impl: human
  run: save the letter to review/journal/decision_<n>.md
  in:
  - submission_record
  out:
  - decision_letter
- id: P16.02
  lane: P16
  kind: decision
  title: Editorial outcome
  exec: human
  impl: human
  run: record in review/decisions.yaml#P16.02
  options:
  - accept
  - revise
  - reject
  criterion: as stated in the decision letter
  in:
  - decision_letter
  out:
  - editorial_decision
- id: P16.03
  lane: P16
  kind: loop
  title: Revision rounds
  exec: ai+human
  impl: exists
  when: P16.02 == revise
  run: loop over P16.03a-e; reuses src/pipeline/revision.py patterns
  guard: editor returns accept
  bound: 3
  progress: open reviewer points
  body:
  - P16.03a
  - P16.03b
  - P16.03c
  - P16.03d
  - P16.03e
  in:
  - decision_letter
  - editorial_decision
  - ms_final
  - claims_ledger
  - references
  out:
  - ms_accepted_rev
- id: P16.03a
  parent: P16.03
  lane: P16
  kind: task
  title: Parse reviewer comments into a response matrix
  exec: agent
  impl: exists
  skill: sr-submission
  mode: response-matrix
  run: agsci board run src/systematic_review/board.yaml P16.03a --root <project>
  in:
  - decision_letter
  out:
  - response_matrix
- id: P16.03b
  parent: P16.03
  lane: P16
  kind: task
  title: Author triages each point (revise / rebut)
  exec: human
  impl: human
  run: mark each row in review/journal/response_<n>.yaml
  in:
  - response_matrix
  out:
  - triage
- id: P16.03c
  parent: P16.03
  lane: P16
  kind: task
  title: Revise manuscript and re-run every gate (grounding, refs, compile, proof)
  exec: ai+human
  impl: exists
  skill: sr-fold
  mode: revise
  run: 'agsci board run src/systematic_review/board.yaml P16.03c --root <project>  # AI drafts; a person reviews, then agsci board done'
  in:
  - triage
  - ms_final
  - claims_ledger
  - references
  out:
  - ms_revised
- id: P16.03d
  parent: P16.03
  lane: P16
  kind: task
  title: Response letter
  exec: agent
  impl: exists
  skill: sr-submission
  mode: response-letter
  run: agsci board run src/systematic_review/board.yaml P16.03d --root <project>
  in:
  - ms_revised
  - triage
  out:
  - response_letter
- id: P16.03e
  parent: P16.03
  lane: P16
  kind: task
  title: Author approves and resubmits; record the next decision
  exec: human
  impl: human
  run: resubmit; save next decision letter
  in:
  - response_letter
  - ms_revised
  out:
  - resubmission
- id: P16.04
  lane: P16
  kind: loop
  title: Reformat and resubmit to the next fallback journal
  exec: ai+human
  impl: exists
  when: P16.02 == reject
  run: agsci board start ... P16.04; run body P16.04a-b; agsci board iterate ... P16.04 --note <guard result> until the guard holds, then agsci board done
    ... P16.04
  guard: a journal accepts
  bound: 2
  progress: fallback journals remaining
  body:
  - P16.04a
  - P16.04b
  in:
  - editorial_decision
  - journal_choice
  - ms_final
  - decision_letter
  out:
  - ms_accepted_fallback
- id: P16.04a
  parent: P16.04
  lane: P16
  kind: task
  title: Re-profile, re-template and re-typeset for the next journal
  exec: script
  impl: exists
  run: agsci sr journal-profile --shortlist review/journal_shortlist.yaml --choice <choice with the next fallback as primary> --out review/journal_profile.yaml
    && agsci sr template ... && agsci board run ... P13.01 (typeset), then P13.02 compile loop, P13.05 limits and P14 proof gates for the new journal
  in:
  - journal_choice
  - ms_final
  - decision_letter
  out:
  - ms_retargeted
- id: P16.04b
  parent: P16.04
  lane: P16
  kind: task
  title: Author approves and submits
  exec: human
  impl: human
  run: submit; record decision letter
  in:
  - ms_retargeted
  out:
  - fallback_submission
- id: P17.01
  lane: P17
  kind: task
  title: Check galley proofs
  exec: human
  impl: human
  when: P16.02 == accept
  run: compare proofs against manuscript/main.pdf; return corrections
  in:
  - editorial_decision
  - ms_final
  - ms_accepted_rev
  - ms_accepted_fallback
  optional:
  - ms_accepted_rev
  - ms_accepted_fallback
  out:
  - proofs_approved
- id: P17.02
  lane: P17
  kind: task
  title: Link publication DOI on OSF registration
  exec: human
  impl: human
  run: add the DOI and final deviations log to the OSF registration
  in:
  - proofs_approved
  - osf_registration
  - deviations_log
  out:
  - osf_final
- id: P17.03
  lane: P17
  kind: task
  title: Archive the run (board ledger, AI-use log, hashes)
  exec: script
  impl: exists
  run: agsci sr archive --root <project> --out review/archive_manifest.json
  in:
  - proofs_approved
  - osf_final
  out:
  - archive_manifest
- id: P17.04
  lane: P17
  kind: milestone
  title: Published
  exec: human
  impl: human
  run: mark board complete
  in:
  - archive_manifest
  out:
  - published
