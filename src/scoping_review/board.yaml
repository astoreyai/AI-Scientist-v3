# Scoping review as an Atomic Task Graph (research type: scoping_review).
#
# Edges are derived, never written: a node depends on whichever node produces an artifact
# listed in its `in`. Inputs listed again under `optional` may be absent because their producer
# was skipped; a skipped producer of any other input skips the node too. `when: <decision> == <option>` makes a node conditional; a skipped
# node counts as done for readiness and its outputs are simply absent downstream.
# Loop bodies are ordinary nodes with `parent:`; their outputs never leave the loop, and the
# loop node's own `out` is its external interface.
#
# exec: script (deterministic code) | agent (AI agent, logged to the AI-use ledger)
#       | skill (host Claude skill) | human | ai+human (AI drafts, a human decides)
# impl: exists (path named in run) | new (module this plan builds) | human
#
# Validate and render:  agsci board check src/scoping_review/board.yaml

meta:
  title: Scoping review — atomic task graph
  research_type: scoping_review
  version: 1
  summary: >-
    End-to-end scoping review from topic choice to publication. Screening uses an AI second
    reviewer with a human adjudicator (Phase-0 decision, 2026-10-15). Thresholds live in
    `thresholds` with their sources so a reviewer can audit every gate.
  givens: []
  thresholds:
    pilot_ta_sample: {value: 25, unit: records, source: "JBI Manual 10.2.7.1 https://jbi-global.atlassian.net/wiki/spaces/MANUAL/pages/2049540102"}
    pilot_ta_agreement: {value: 0.75, unit: proportion, source: "JBI Manual 10.2.7.1 (start full screening only at >= 75% agreement)"}
    pilot_chart_sources: {value: 3, unit: sources per source type, source: "JBI Manual 10.2.9.2 (at least 2-3 per evidence source type)"}
    pilot_chart_agreement: {value: 0.8, unit: proportion of fields, source: "project choice; JBI sets no number"}
    seed_recall: {value: 0.9, unit: proportion, source: "project choice; reported, not a published standard"}
    al_trigger_records: {value: 3000, unit: records, source: "project choice; stopping rule = SAFE (Boetje & van de Schoot 2024, Syst Rev 13:81)"}
    search_age_months: {value: 12, unit: months, source: "Cochrane MECIR C37 by analogy (re-run within 12 months, preferably 6); JBI 10.4 updates every 2-3 years"}
    dedup_check_pairs: {value: 50, unit: merged pairs, source: "project choice"}
    review_rounds: {value: 3, unit: rounds, source: "project choice (fold cycles introduce regressions; mays/013 history)"}
  paths:  # artifact -> location under the review root; "#key" = entry in a file; {iter} = loop iteration
    topic_idea: "review/topic.md"
    prior_reviews: "review/prior_reviews.json"
    dup_decision: "review/decisions.yaml#P0.03"
    pcc_draft: "review/pcc.md"
    review_type_decision: "review/decisions.yaml#P0.05"
    pcc_final: "review/pcc.md"
