  - id: P8.06
    lane: P8
    kind: task
    title: Narrative synthesis by review question, with claims ledger
    exec: agent
    impl: exists
    skill: sr-synthesize
    mode: synthesize
    run: "agsci board run src/scoping_review/board.yaml P8.06 --root <project>"
    in: [coded_verified, stats, gap_map, consult_notes, pcc_final]
    optional: [consult_notes]
    out: [synthesis, claims_ledger]
  - id: P8.07
    lane: P8
    kind: task
    title: "Figure: PRISMA flow diagram"
    exec: script
    impl: exists
    run: "agsci sr fig prisma --in review/prisma_counts.json --out manuscript/figures/prisma.pdf"
    in: [prisma_counts, reporting_std]
    out: [fig_prisma]
  - id: P8.08
    lane: P8
    kind: task
    title: "Figure: sources by year and type"
    exec: script
    impl: exists
    run: "agsci sr fig timeline --in review/chart/frozen.jsonl --stack-field <field> --out manuscript/figures/timeline.pdf"
    in: [stats]
    out: [fig_timeline]
  - id: P8.09
    lane: P8
    kind: task
    title: "Figure: evidence gap map"
    exec: script
    impl: exists
    run: "agsci sr fig gapmap --in review/synthesis/gap_map.json --out manuscript/figures/gapmap.pdf"
    in: [gap_map]
    out: [fig_gapmap]
  - id: P8.10
    lane: P8
    kind: task
    title: "Figure: geographic and venue distribution"
    exec: script
    impl: exists
    run: "agsci sr fig bars --in review/synthesis/stats.json --field country --out manuscript/figures/geo.pdf"
    in: [stats]
    out: [fig_geo]
  - id: P8.11
    lane: P8
    kind: task
    title: "Figure: category distribution"
    exec: script
    impl: exists
    run: "agsci sr fig bars --in review/synthesis/stats.json --field <category field> --out manuscript/figures/alluvial.pdf"
    in: [coded_verified]
    out: [fig_alluvial]
  - id: P8.12
    lane: P8
    kind: task
    title: "Table: characteristics of included sources"
    exec: script
    impl: exists
    run: "agsci sr table characteristics --in review/chart/frozen.jsonl --columns <field:Label ...> --cite-keys manuscript/cite_keys.json --out manuscript/tables/characteristics.tex"
    in: [chart_frozen, refs_included]
    out: [tab_characteristics]
  - id: P8.13
    lane: P8
    kind: decision
    title: Graphical abstract or concept figure needed?
    exec: human
    impl: human
    run: "check journal profile; record in review/decisions.yaml#P8.13"
    options: ["yes", "no"]
    criterion: "yes if the journal requires a graphical abstract or the framework needs a concept diagram"
    in: [journal_profile]
    out: [ga_decision]
  - id: P8.14
    lane: P8
    kind: task
    title: Concept figure / graphical abstract
    exec: agent
    impl: exists
    skill: generate-concept-figure
    mode: default
    when: "P8.13 == yes"
    run: "agsci board run src/scoping_review/board.yaml P8.14 --root <project>"
    in: [ga_decision, synthesis]
    out: [fig_concept]
  - id: P8.15
    lane: P8
    kind: loop
    title: Figure QA
    exec: skill
    impl: exists
    run: "loop over P8.15a-b"
    guard: "latex-figures audit reports 0 defects (colorblind-safe, legible at print size, fonts embedded)"
    bound: 3
    progress: "figure defects"
    body: [P8.15a, P8.15b]
    in: [fig_prisma, fig_timeline, fig_gapmap, fig_geo, fig_alluvial, fig_concept]
    optional: [fig_concept]
    out: [figures_final]
  - id: P8.15a
    parent: P8.15
    lane: P8
    kind: task
    title: Audit figures
    exec: skill
    impl: exists
    run: "/latex-figures manuscript/figures/"
    in: [fig_prisma, fig_timeline, fig_gapmap, fig_geo, fig_alluvial, fig_concept]
    optional: [fig_concept]
    out: [figure_audit]
  - id: P8.15b
    parent: P8.15
    lane: P8
    kind: task
    title: Fix figure scripts and regenerate
    exec: agent
    impl: exists
    skill: sr-latex
    mode: figures
    run: "agsci board run src/scoping_review/board.yaml P8.15b --root <project>"
    in: [figure_audit]
    out: [figures_rev]
  - id: P8.16
    lane: P8
    kind: gate
    title: Synthesis grounded in frozen data
    exec: script
    impl: exists
    run: "agsci sr audit-claims --claims review/synthesis/claims_grounding.json --data review/chart/verified.jsonl --stats review/synthesis/stats.json --out review/synthesis/audit.json"
    approver: lead reviewer
    criterion: "every claim cites >= 1 included record ID; every figure is built only from frozen data and has a supporting narrative (JBI 10.2.11); descriptive counts and basic content analysis only, no meta-analysis or interpretive synthesis (JBI 10.2.10)"
    in: [synthesis, claims_ledger, figures_final, chart_frozen]
    out: [synthesis_ok]

  # ---------------------------------------------------------------- P9 Drafting
  - id: P9.01
    lane: P9
    kind: task
    title: Outline mapped to reporting items and journal structure
    exec: agent
    impl: exists
    skill: sr-draft
    mode: outline
    run: "agsci board run src/scoping_review/board.yaml P9.01 --root <project>"
    in: [journal_profile, reporting_std, synthesis_ok]
    out: [outline]
  - id: P9.02
    lane: P9
    kind: task
    title: Draft Methods
    exec: agent
    impl: exists
    skill: sr-draft
    mode: methods
    run: "agsci board run src/scoping_review/board.yaml P9.02 --root <project>"
    in: [outline, protocol_frozen, deviations_log, search_log, ta_kappa, ft_kappa, calibration_report, ai_reviewer_spec]
    out: [sec_methods]
  - id: P9.03
    lane: P9
    kind: task
    title: Draft Results
    exec: agent
    impl: exists
    skill: sr-draft
    mode: results
    run: "agsci board run src/scoping_review/board.yaml P9.03 --root <project>"
    in: [outline, synthesis, claims_ledger, figures_final, tab_characteristics, prisma_counts]
    out: [sec_results]
  - id: P9.04
    lane: P9
    kind: task
    title: Draft Introduction (CARS framing)
    exec: agent
    impl: exists
    skill: sr-draft
    mode: introduction
    run: "agsci board run src/scoping_review/board.yaml P9.04 --root <project>"
    in: [outline, pcc_final, prior_reviews]
    out: [sec_intro]
  - id: P9.05
    lane: P9
    kind: task
    title: Draft Discussion and limitations (incl. AI-screening limits)
    exec: agent
    impl: exists
    skill: sr-draft
    mode: discussion
    run: "agsci board run src/scoping_review/board.yaml P9.05 --root <project>"
    in: [sec_results, synthesis, gap_map]
    out: [sec_discussion]
  - id: P9.06
    lane: P9
    kind: task
    title: Draft Conclusion
    exec: agent
    impl: exists
    skill: sr-draft
    mode: conclusion
    run: "agsci board run src/scoping_review/board.yaml P9.06 --root <project>"
    in: [sec_discussion]
    out: [sec_conclusion]
  - id: P9.07
    lane: P9
    kind: task
    title: Draft structured abstract and title ("scoping review" in title)
    exec: agent
    impl: exists
    skill: sr-draft
    mode: abstract
    run: "agsci board run src/scoping_review/board.yaml P9.07 --root <project>"
    in: [sec_methods, sec_results, sec_conclusion, journal_profile]
    out: [sec_abstract]
  - id: P9.08
    lane: P9
    kind: task
    title: Declarations (AI use, data availability, CRediT, funding, COI, registration)
    exec: agent
    impl: exists
    skill: sr-draft
    mode: declarations
    run: "agsci board run src/scoping_review/board.yaml P9.08 --root <project>"
    in: [ai_reviewer_spec, team, osf_registration, journal_profile]
    out: [sec_declarations]
  - id: P9.09
    lane: P9
    kind: task
    title: Supplementary material (search strings, form, included and excluded lists)
    exec: script
    impl: exists
    run: "agsci sr supplement --search-dir review/search --charting-form review/charting_form.yaml --included review/included.jsonl --ft-final review/screen/ft_final.jsonl --records review/records/dedup.jsonl --out manuscript/supplement/"
    in: [search_final, charting_form_final, included_final, ft_decisions]
    out: [supplement]
  - id: P9.10
    lane: P9
    kind: task
    title: Assemble manuscript in the journal template
    exec: script
    impl: exists
    run: "agsci sr assemble --sections <outline order, e.g. abstract introduction methods results discussion conclusion declarations> --out manuscript/main.tex"
    in: [tex_template, sec_abstract, sec_intro, sec_methods, sec_results, sec_discussion, sec_conclusion, sec_declarations, supplement]
    out: [ms_v1]
  - id: P9.11
    lane: P9
    kind: gate
    title: Every empirical claim grounded
    exec: script
    impl: exists
    run: "agsci sr audit-claims --claims review/synthesis/claims_grounding.json --data review/chart/verified.jsonl --stats review/synthesis/stats.json --tex manuscript --cite-keys manuscript/cite_keys.json --out review/audit/grounding_v1.json"
    approver: lead reviewer
    criterion: "0 ungrounded empirical claims"
    in: [ms_v1, claims_ledger, chart_frozen]
    out: [grounding_ok_v1]

  # ---------------------------------------------------------------- P10 References
  - id: P10.01
    lane: P10
    kind: task
    title: BibTeX for included sources via DOI
    exec: script
    impl: exists
    run: "agsci sr bib --included review/included.jsonl --out manuscript/refs_included.bib --keys manuscript/cite_keys.json"
    in: [included_final]
    out: [refs_included]
  - id: P10.02
    lane: P10
    kind: task
    title: Background references
    exec: agent
    impl: exists
    skill: retrieve-references
    mode: default
    run: "agsci board run src/scoping_review/board.yaml P10.02 --root <project>"
    in: [sec_intro, sec_discussion]
    out: [refs_background]
  - id: P10.03
    lane: P10
    kind: task
    title: Merge and deduplicate bibliography
    exec: script
    impl: exists
    run: "agsci sr bib-merge manuscript/refs_included.bib manuscript/refs_background.bib --out manuscript/references.bib"
    in: [refs_included, refs_background]
    out: [references]
  - id: P10.04
    lane: P10
    kind: task
    title: Reference integrity (dangling, orphans, DOIs, metadata)
    exec: skill
    impl: exists
    run: "/ref-bolster --verify-only manuscript/main.tex"
    in: [references, ms_v1]
    out: [ref_report]
  - id: P10.05
    lane: P10
    kind: task
    title: Retraction check
    exec: script
    impl: exists
    run: "agsci sr retractions --bib manuscript/references.bib --out review/refs/retractions.json"
    in: [references]
    out: [retraction_report]
  - id: P10.06
    lane: P10
    kind: task
    title: Citation content match (cited source supports the claim)
    exec: skill
    impl: exists
    run: "/claim-to-source manuscript/main.tex"
    in: [references, ms_v1]
    out: [citation_support]
  - id: P10.07
    lane: P10
    kind: gate
    title: References clean
    exec: script
    impl: exists
    run: "agsci sr check-refs --tex manuscript --bib manuscript/references.bib --retractions review/refs/retractions.json --out review/refs/ok.json  (and read review/refs/integrity.md + citation_support.md: 0 open items)"
    approver: lead reviewer
    criterion: "0 dangling, 0 orphan, 0 unresolved DOI, 0 unflagged retraction, 0 unsupported citation"
    in: [ref_report, retraction_report, citation_support]
    out: [refs_ok]

  # ---------------------------------------------------------------- P11 Editing
  - id: P11.01
    lane: P11
    kind: task
    title: Developmental edit (argument, reporting-item coverage)
    exec: agent
    impl: exists
    skill: sr-fold
    mode: developmental
    run: "agsci board run src/scoping_review/board.yaml P11.01 --root <project>"
    in: [ms_v1, grounding_ok_v1, refs_ok, outline]
    out: [ms_dev]
  - id: P11.02
    lane: P11
    kind: task
    title: Flow pass
    exec: skill
    impl: exists
    run: "/disjoint manuscript/main.tex"
    in: [ms_dev]
    out: [ms_flow]
  - id: P11.03
    lane: P11
    kind: task
    title: Sentence-level pass
    exec: skill
    impl: exists
    run: "/sciwrite manuscript/main.tex"
    in: [ms_flow]
    out: [ms_sentence]
  - id: P11.04
    lane: P11
    kind: task
    title: Voice check and author rewrite
    exec: ai+human
    impl: exists
    run: "/humanizer --detect-only manuscript/main.tex → author rewrites flagged passages"
    in: [ms_sentence]
    out: [ms_voice]
  - id: P11.05
    lane: P11
    kind: task
    title: House-style lint (no dashes, banned words, terminology)
    exec: script
    impl: exists
    run: "agsci sr lint manuscript/main.tex"
    in: [ms_voice]
    out: [ms_edited]
  - id: P11.06
    lane: P11
    kind: gate
    title: No regressions from editing
    exec: script
    impl: exists
    run: "agsci sr audit-claims ... --tex manuscript --out review/audit/edit.json && agsci sr check-refs --tex manuscript --bib manuscript/references.bib"
    approver: lead reviewer
    criterion: "grounding and reference checks still at 0 findings after edits"
    in: [ms_edited, claims_ledger, references]
    out: [edit_ok]

  # ---------------------------------------------------------------- P12 Internal review
  - id: P12.01
    lane: P12
    kind: loop
    title: Adversarial review rounds
    exec: ai+human
    impl: exists
    run: "loop over P12.01a-d"
    guard: "0 critical and 0 major findings across reviewers"
    bound: 3
    progress: "critical + major findings"
    body: [P12.01a, P12.01b, P12.01c, P12.01d]
    in: [ms_edited, edit_ok, claims_ledger, references]
    out: [ms_reviewed, review_ledger]
  - id: P12.01a
    parent: P12.01
    lane: P12
    kind: task
    title: Journal-style referee report
    exec: skill
    impl: exists
    run: "/scientific-reviewer --format=journal manuscript/main.tex"
    in: [ms_edited]
    out: [review_journal]
  - id: P12.01b
    parent: P12.01
    lane: P12
    kind: task
    title: Independent Codex/Sol validation
    exec: agent
    impl: exists
    skill: review-paper
    mode: default
    run: "agsci board run src/scoping_review/board.yaml P12.01b --root <project>"
    in: [ms_edited]
    out: [review_codex]
  - id: P12.01c
    parent: P12.01
    lane: P12
    kind: task
    title: Fold findings (author decides each)
    exec: ai+human
    impl: exists
    skill: sr-fold
    mode: fold
    run: "agsci board run src/scoping_review/board.yaml P12.01c --root <project>  # AI drafts; a person reviews, then agsci board done"
    in: [review_journal, review_codex]
    out: [ms_folded]
  - id: P12.01d
    parent: P12.01
    lane: P12
    kind: task
    title: Re-verify grounding and references after the fold
    exec: script
    impl: exists
    run: "agsci sr audit-claims ... --tex manuscript --out review/reviews/round_{iter}/recheck.json && agsci sr check-refs --tex manuscript --bib manuscript/references.bib"
    in: [ms_folded, claims_ledger, references]
    out: [fold_check]
  - id: P12.02
    lane: P12
    kind: gate
    title: All-author approval of content
    exec: human
    impl: human
    run: "circulate PDF; record each author's written approval in review/approvals.yaml"
    approver: all authors
    criterion: "every author approves in writing"
    in: [ms_reviewed, team]
    out: [author_approval]

  # ---------------------------------------------------------------- P13 Typesetting and layout
  - id: P13.01
    lane: P13
    kind: task
    title: Apply journal class, citation style, float placement, landscape tables
    exec: agent
    impl: exists
    skill: sr-latex
    mode: typeset
    run: "agsci board run src/scoping_review/board.yaml P13.01 --root <project>"
    in: [ms_reviewed, author_approval, tex_template, references, figures_final, tab_characteristics, journal_profile]
    out: [ms_typeset_src]
  - id: P13.02
    lane: P13
    kind: loop
    title: Compile until clean
    exec: script
    impl: exists
    run: "loop over P13.02a-b"
    guard: "0 LaTeX errors, 0 undefined refs/cites, 0 overfull boxes > 1pt, bbl contains every URL/DOI"
    bound: 5
    progress: "errors + warnings"
    body: [P13.02a, P13.02b]
    in: [ms_typeset_src]
    out: [ms_pdf]
  - id: P13.02a
    parent: P13.02
    lane: P13
    kind: task
    title: Compile and validate references
    exec: script
    impl: exists
    run: "bash src/agents/skills/validate-paper/scripts/compile_latex.sh manuscript/main.tex && python src/agents/skills/validate-paper/scripts/validate_tex_refs.py --tex manuscript/main.tex --bib manuscript/references.bib"
    in: [ms_typeset_src]
    out: [compile_log]
  - id: P13.02b
    parent: P13.02
    lane: P13
    kind: task
    title: Fix LaTeX issues
    exec: agent
    impl: exists
    skill: sr-latex
    mode: fix
    run: "agsci board run src/scoping_review/board.yaml P13.02b --root <project>"
    in: [compile_log]
    out: [latex_fix]
  - id: P13.03
    lane: P13
    kind: task
    title: 150-point PDF inspection
    exec: skill
    impl: exists
    run: "/latex-inspect manuscript/main.pdf"
    in: [ms_pdf]
    out: [inspect_report]
  - id: P13.04
    lane: P13
    kind: task
    title: Page-by-page visual inspection
    exec: skill
    impl: exists
    run: "/visual-inspect manuscript/main.pdf"
    in: [ms_pdf]
    out: [visual_report]
  - id: P13.05
    lane: P13
    kind: decision
    title: Within journal limits (words, abstract, figures, tables, refs)?
    exec: script
    impl: exists
    run: "agsci sr limits --tex manuscript/main.tex --profile review/journal_profile.yaml  # exit 1 = no"
    options: ["yes", "no"]
    criterion: "every count at or under the journal profile limit"
    in: [ms_pdf, journal_profile]
    out: [limits_decision]
  - id: P13.06
    lane: P13
    kind: loop
    title: Trim to limits
    exec: ai+human
    impl: exists
    when: "P13.05 == no"
    run: "agsci board start ... P13.06; run body P13.06a-b; agsci board iterate ... P13.06 --note <guard result> until the guard holds, then agsci board done ... P13.06"
    guard: "agsci sr limits exits 0"
    bound: 3
    progress: "words over limit"
    body: [P13.06a, P13.06b]
    in: [ms_pdf, limits_decision, journal_profile]
    out: [ms_trimmed]
  - id: P13.06a
    parent: P13.06
    lane: P13
    kind: task
    title: Move detail to supplement or condense (author approves cuts)
    exec: ai+human
    impl: exists
    skill: sr-latex
    mode: trim
    run: "agsci board run src/scoping_review/board.yaml P13.06a --root <project>  # AI drafts; a person reviews, then agsci board done"
    in: [ms_pdf, journal_profile]
    out: [trim_edit]
  - id: P13.06b
    parent: P13.06
    lane: P13
    kind: task
    title: Recompile and recount
    exec: script
    impl: exists
    run: "bash src/agents/skills/validate-paper/scripts/compile_latex.sh manuscript/main.tex && agsci sr limits --tex manuscript/main.tex --profile review/journal_profile.yaml"
    in: [trim_edit]
    out: [trim_check]
  - id: P13.07
    lane: P13
    kind: gate
    title: Layout clean
    exec: script
    impl: exists
    run: "agsci sr check-layout --pdf manuscript/main.pdf && test -s review/layout/inspect.md && test -s review/layout/visual.md  (0 blocking findings in both, limits decision yes or trimmed)"
    approver: lead reviewer
    criterion: "0 blocking inspection findings, all fonts embedded, within limits"
    in: [inspect_report, visual_report, limits_decision, ms_trimmed]
    optional: [ms_trimmed]
    out: [layout_ok]

  # ---------------------------------------------------------------- P14 Proofreading
  - id: P14.01
    lane: P14
    kind: task
    title: Numbers consistency (flow diagram = abstract = results = tables)
    exec: script
    impl: exists
    run: "agsci sr check-numbers --pdf manuscript/main.pdf --counts review/prisma_counts.json"
    in: [layout_ok, prisma_counts, stats]
    out: [numbers_report]
  - id: P14.02
    lane: P14
    kind: task
    title: Automated proof checks (cross-refs, numbering, acronyms, spelling)
    exec: script
    impl: exists
    run: "agsci sr proof-auto --tex manuscript --wordlist manuscript/wordlist.txt --out review/proof/auto.md"
    in: [layout_ok]
    out: [proof_auto]
  - id: P14.03
    lane: P14
    kind: task
    title: AI proofread (tracked change list)
    exec: agent
    impl: exists
    skill: sr-proof
    mode: proofread
    run: "agsci board run src/scoping_review/board.yaml P14.03 --root <project>"
    in: [layout_ok]
    out: [proof_ai]
  - id: P14.04
    lane: P14
    kind: task
    title: Human proofread of the final PDF
    exec: human
    impl: human
    run: "read the PDF aloud against review/proof/ai.md; accept or reject each change"
    in: [proof_ai, proof_auto, numbers_report]
    out: [proof_human]
  - id: P14.05
    lane: P14
    kind: task
    title: Reporting checklist with page numbers
    exec: script
    impl: exists
    when: "P1.04 == prisma_scr"
    run: "agsci sr checklist prisma_scr_2018 --map manuscript/reporting_map.yaml --aux manuscript/main.aux --out manuscript/supplement/reporting_checklist.pdf"
    in: [layout_ok, reporting_std]
    out: [reporting_checklist]
  - id: P14.06
    lane: P14
    kind: gate
    title: Proof complete
    exec: human
    impl: human
    run: "lead author signs review/proof/signoff.md"
    approver: lead author
    criterion: "0 open proof items, numbers consistent, checklist complete when required"
    in: [proof_human, numbers_report, reporting_checklist]
    optional: [reporting_checklist]
    out: [ms_final]

  # ---------------------------------------------------------------- P15 Submission
  - id: P15.01
    lane: P15
    kind: decision
    title: Is the search older than the freshness limit?
    exec: script
    impl: exists
    run: "agsci sr search-age --log review/search_log.json --max-months 12 --on <planned submission date>  # exit 1 = yes"
    options: ["yes", "no"]
    criterion: "yes if the last search date is more than thresholds.search_age_months before planned submission"
    in: [search_log, ms_final]
    out: [update_decision]
  - id: P15.02
    lane: P15
    kind: task
    title: Update the search and integrate new sources
    exec: ai+human
    impl: exists
    when: "P15.01 == yes"
    run: "agsci sr search --strategies review/search --since <last search date> --out review/update/raw --log review/update/search_log.json && agsci sr dedup review/update/raw --against review/records/dedup.jsonl --out review/update/new.jsonl --log review/update/dedup_log.json, then screen, chart and synthesise the new records with the same commands (sheet/agreement/finalize/check-stage/chart/describe), recompute prisma, and re-run gates from P9.11"
    in: [update_decision, search_final, ms_final]
    out: [ms_updated]
  - id: P15.03
    lane: P15
    kind: task
    title: Cover letter
    exec: agent
    impl: exists
    skill: sr-submission
    mode: cover-letter
    run: "agsci board run src/scoping_review/board.yaml P15.03 --root <project>"
    in: [ms_final, journal_profile]
    out: [cover_letter]
  - id: P15.04
    lane: P15
    kind: task
    title: Suggested and opposed reviewers (no conflicts of interest)
    exec: ai+human
    impl: exists
    skill: sr-submission
    mode: reviewers
    run: "agsci board run src/scoping_review/board.yaml P15.04 --root <project>  # AI drafts; a person reviews, then agsci board done"
    in: [references, journal_profile]
    out: [reviewer_suggestions]
  - id: P15.05
    lane: P15
    kind: task
    title: Highlights / key points
    exec: agent
    impl: exists
    skill: sr-submission
    mode: highlights
    run: "agsci board run src/scoping_review/board.yaml P15.05 --root <project>"
    in: [ms_final, journal_profile]
    out: [highlights]
  - id: P15.06
    lane: P15
    kind: decision
    title: Post a preprint?
    exec: human
    impl: human
    run: "check journal preprint policy; record in review/decisions.yaml#P15.06"
    options: ["yes", "no"]
    criterion: "journal permits preprints and the authors want one"
    in: [journal_profile, ms_final]
    out: [preprint_decision]
  - id: P15.07
    lane: P15
    kind: task
    title: Post the preprint
    exec: human
    impl: human
    when: "P15.06 == yes"
    run: "upload to arXiv / OSF Preprints; record DOI"
    in: [preprint_decision, ms_final]
    out: [preprint_doi]
  - id: P15.08
    lane: P15
    kind: task
    title: Deposit review data on the OSF project
    exec: human
    impl: human
    run: "upload search strings, search log, dedup log, screening decisions (human + AI), charting dataset, code"
    in: [osf_registration, chart_frozen, search_log, dedup_log, ta_decisions, ft_decisions]
    out: [data_deposit]
  - id: P15.09
    lane: P15
    kind: task
    title: Stage the submission package in Outbox
    exec: script
    impl: exists
    run: "agsci sr package manuscript/main.pdf manuscript/supplement submission/cover_letter.tex submission/reviewers.yaml [submission/highlights.txt] --out ~/Desktop/Outbox/<YYYY-MM-DD>_<slug>/  (review-pending; nothing is sent)"
    in: [ms_final, ms_updated, cover_letter, reviewer_suggestions, highlights, reporting_checklist, supplement, data_deposit]
    optional: [ms_updated, reporting_checklist]
    out: [outbox_package]
  - id: P15.10
    lane: P15
    kind: gate
    title: Submit
    exec: human
    impl: human
    run: "corresponding author submits via the journal system; record manuscript ID in review/submission.yaml"
    approver: corresponding author
    criterion: "all authors approved the final package"
    in: [outbox_package, author_approval]
    out: [submission_record]

  # ---------------------------------------------------------------- P16 Peer review and revision
  - id: P16.01
    lane: P16
    kind: task
    title: Record the editorial decision letter
    exec: human
    impl: human
    run: "save the letter to review/journal/decision_<n>.md"
    in: [submission_record]
    out: [decision_letter]
  - id: P16.02
    lane: P16
    kind: decision
    title: Editorial outcome
    exec: human
    impl: human
    run: "record in review/decisions.yaml#P16.02"
    options: [accept, revise, reject]
    criterion: "as stated in the decision letter"
    in: [decision_letter]
    out: [editorial_decision]
  - id: P16.03
    lane: P16
    kind: loop
    title: Revision rounds
    exec: ai+human
    impl: exists
    when: "P16.02 == revise"
    run: "loop over P16.03a-e; reuses src/pipeline/revision.py patterns"
    guard: "editor returns accept"
    bound: 3
    progress: "open reviewer points"
    body: [P16.03a, P16.03b, P16.03c, P16.03d, P16.03e]
    in: [decision_letter, editorial_decision, ms_final, claims_ledger, references]
    out: [ms_accepted_rev]
  - id: P16.03a
    parent: P16.03
    lane: P16
    kind: task
    title: Parse reviewer comments into a response matrix
    exec: agent
    impl: exists
    skill: sr-submission
    mode: response-matrix
    run: "agsci board run src/scoping_review/board.yaml P16.03a --root <project>"
    in: [decision_letter]
    out: [response_matrix]
  - id: P16.03b
    parent: P16.03
    lane: P16
    kind: task
    title: Author triages each point (revise / rebut)
    exec: human
    impl: human
    run: "mark each row in review/journal/response_<n>.yaml"
    in: [response_matrix]
    out: [triage]
  - id: P16.03c
    parent: P16.03
    lane: P16
    kind: task
    title: Revise manuscript and re-run every gate (grounding, refs, compile, proof)
    exec: ai+human
    impl: exists
    skill: sr-fold
    mode: revise
    run: "agsci board run src/scoping_review/board.yaml P16.03c --root <project>  # AI drafts; a person reviews, then agsci board done"
    in: [triage, ms_final, claims_ledger, references]
    out: [ms_revised]
  - id: P16.03d
    parent: P16.03
    lane: P16
    kind: task
    title: Response letter
    exec: agent
    impl: exists
    skill: sr-submission
    mode: response-letter
    run: "agsci board run src/scoping_review/board.yaml P16.03d --root <project>"
    in: [ms_revised, triage]
    out: [response_letter]
  - id: P16.03e
    parent: P16.03
    lane: P16
    kind: task
    title: Author approves and resubmits; record the next decision
    exec: human
    impl: human
    run: "resubmit; save next decision letter"
    in: [response_letter, ms_revised]
    out: [resubmission]
  - id: P16.04
    lane: P16
    kind: loop
    title: Reformat and resubmit to the next fallback journal
    exec: ai+human
    impl: exists
    when: "P16.02 == reject"
    run: "agsci board start ... P16.04; run body P16.04a-b; agsci board iterate ... P16.04 --note <guard result> until the guard holds, then agsci board done ... P16.04"
    guard: "a journal accepts"
    bound: 2
    progress: "fallback journals remaining"
    body: [P16.04a, P16.04b]
    in: [editorial_decision, journal_choice, ms_final, decision_letter]
    out: [ms_accepted_fallback]
  - id: P16.04a
    parent: P16.04
    lane: P16
    kind: task
    title: Re-profile, re-template and re-typeset for the next journal
    exec: script
    impl: exists
    run: "agsci sr journal-profile --shortlist review/journal_shortlist.yaml --choice <choice with the next fallback as primary> --out review/journal_profile.yaml && agsci sr template ... && agsci board run ... P13.01 (typeset), then P13.02 compile loop, P13.05 limits and P14 proof gates for the new journal"
    in: [journal_choice, ms_final, decision_letter]
    out: [ms_retargeted]
  - id: P16.04b
    parent: P16.04
    lane: P16
    kind: task
    title: Author approves and submits
    exec: human
    impl: human
    run: "submit; record decision letter"
    in: [ms_retargeted]
    out: [fallback_submission]

  # ---------------------------------------------------------------- P17 Publication and archiving
  - id: P17.01
    lane: P17
    kind: task
    title: Check galley proofs
    exec: human
    impl: human
    when: "P16.02 == accept"
    run: "compare proofs against manuscript/main.pdf; return corrections"
    in: [editorial_decision, ms_final, ms_accepted_rev, ms_accepted_fallback]
    optional: [ms_accepted_rev, ms_accepted_fallback]
    out: [proofs_approved]
  - id: P17.02
    lane: P17
    kind: task
    title: Link publication DOI on OSF registration
    exec: human
    impl: human
    run: "add the DOI and final deviations log to the OSF registration"
    in: [proofs_approved, osf_registration, deviations_log]
    out: [osf_final]
  - id: P17.03
    lane: P17
    kind: task
    title: Archive the run (board ledger, AI-use log, hashes)
    exec: script
    impl: exists
    run: "agsci sr archive --root <project> --out review/archive_manifest.json"
    in: [proofs_approved, osf_final]
    out: [archive_manifest]
  - id: P17.04
    lane: P17
    kind: milestone
    title: Published
    exec: human
    impl: human
    run: "mark board complete"
    in: [archive_manifest]
    out: [published]
