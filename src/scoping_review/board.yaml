lanes:
  - {id: P0, name: Topic and go/no-go}
  - {id: P1, name: Journal targeting}
  - {id: P2, name: Protocol and search design}
  - {id: P3, name: Registration}
  - {id: P4, name: Search execution}
  - {id: P5, name: Title/abstract screening}
  - {id: P6, name: Full-text screening}
  - {id: P7, name: Charting}
  - {id: P8, name: Synthesis and visualization}
  - {id: P9, name: Drafting}
  - {id: P10, name: References}
  - {id: P11, name: Editing}
  - {id: P12, name: Internal review}
  - {id: P13, name: Typesetting and layout}
  - {id: P14, name: Proofreading}
  - {id: P15, name: Submission}
  - {id: P16, name: Peer review and revision}
  - {id: P17, name: Publication and archiving}

nodes:
  # ---------------------------------------------------------------- P0 Topic and go/no-go
  - id: P0.01
    lane: P0
    kind: task
    title: Choose the review topic
    exec: human
    impl: human
    run: "write review/topic.md (one paragraph: phenomenon, why now, intended users)"
    out: [topic_idea]
  - id: P0.02
    lane: P0
    kind: task
    title: Search for existing reviews and registered protocols
    exec: agent
    impl: exists
    skill: sr-prior-reviews
    mode: search
    run: "agsci board run src/scoping_review/board.yaml P0.02 --root <project>"
    in: [topic_idea]
    out: [prior_reviews]
  - id: P0.03
    lane: P0
    kind: decision
    title: Does an existing or ongoing review already answer this?
    exec: ai+human
    impl: human
    run: "review review/prior_reviews.json; record choice in review/decisions.yaml#P0.03"
    options: [continue, stop]
    criterion: "stop if a published or registered review covers the same PCC within the last 3 years; continue with a stated differentiation otherwise"
    in: [prior_reviews]
    out: [dup_decision]
  - id: P0.04
    lane: P0
    kind: task
    title: Draft PCC, objective and review questions
    exec: agent
    impl: exists
    skill: sr-question
    mode: pcc
    when: "P0.03 == continue"
    run: "agsci board run src/scoping_review/board.yaml P0.04 --root <project>"
    in: [topic_idea, prior_reviews, dup_decision]
    out: [pcc_draft]
  - id: P0.05
    lane: P0
    kind: decision
    title: Is a scoping review the right review type?
    exec: ai+human
    impl: human
    run: "check review/pcc.md against the Munn et al. 2018 indications; record in review/decisions.yaml#P0.05"
    options: [scoping, systematic, other]
    criterion: "scoping when the aim is to map evidence, clarify concepts or find gaps; systematic when the question is about effectiveness, feasibility or appropriateness (route to systematic_review board)"
    in: [pcc_draft]
    out: [review_type_decision]
  - id: P0.06
    lane: P0
    kind: gate
    title: PCC and questions approved
    exec: human
    impl: human
    when: "P0.05 == scoping"
    run: "lead reviewer signs review/pcc.md (status: approved)"
    approver: lead reviewer
    criterion: "each question maps to P, C and C; scope is answerable with the team's time"
    in: [pcc_draft, review_type_decision]
    out: [pcc_final]
  - id: P0.07
    lane: P0
    kind: task
    title: Assemble team and roles (CRediT)
    exec: human
    impl: human
    run: "write review/team.yaml (lead, adjudicator, librarian if any, co-authors, CRediT roles)"
    in: [pcc_final]
    out: [team]
  - id: P0.08
    lane: P0
    kind: decision
    title: Is a librarian or information specialist available?
    exec: human
    impl: human
    run: "record in review/decisions.yaml#P0.08"
    options: ["yes", "no"]
    criterion: "yes if a named person will do PRESS peer review of the search"
    in: [team]
    out: [librarian_decision]

  # ---------------------------------------------------------------- P1 Journal targeting
  - id: P1.01
    lane: P1
    kind: task
    title: Build journal shortlist with requirement profiles
    exec: agent
    impl: exists
    skill: sr-journals
    mode: shortlist
    run: "agsci board run src/scoping_review/board.yaml P1.01 --root <project>"
    in: [pcc_final]
    out: [journal_shortlist]
  - id: P1.02
    lane: P1
    kind: decision
    title: Choose primary and fallback journals
    exec: human
    impl: human
    run: "edit review/journal_choice.yaml (primary + 2 ordered fallbacks)"
    options: [accept_top_ranked, choose_other]
    criterion: "scope fit, accepts scoping reviews, AI-use policy allows a disclosed AI second reviewer, OA/APC acceptable"
    in: [journal_shortlist]
    out: [journal_choice]
  - id: P1.03
    lane: P1
    kind: task
    title: Compile the journal profile
    exec: script
    impl: exists
    run: "agsci sr journal-profile --shortlist review/journal_shortlist.yaml --choice review/journal_choice.yaml --out review/journal_profile.yaml"
    in: [journal_choice]
    out: [journal_profile]
  - id: P1.04
    lane: P1
    kind: decision
    title: Report with PRISMA-ScR?
    exec: ai+human
    impl: human
    run: "record in review/decisions.yaml#P1.04"
    options: [prisma_scr, jbi_only]
    criterion: "prisma_scr when the journal requires it or the protocol commits to it; jbi_only otherwise. Use the version current at submission (2018 checklist current as of 2026-10; update in development, Tricco et al. 2026 J Clin Epidemiol 196:112314)"
    in: [journal_profile]
    out: [reporting_std]
  - id: P1.05
    lane: P1
    kind: task
    title: Fetch the journal LaTeX template, class and bibliography style
    exec: script
    impl: exists
    run: "agsci sr template --profile review/journal_profile.yaml --out manuscript/  (no template URL in the profile: keep the article draft from P9.10 until one is found)"
    in: [journal_profile]
    out: [tex_template]

  # ---------------------------------------------------------------- P2 Protocol and search design
  - id: P2.01
    lane: P2
    kind: task
    title: Draft eligibility criteria
    exec: agent
    impl: exists
    skill: sr-question
    mode: eligibility
    run: "agsci board run src/scoping_review/board.yaml P2.01 --root <project>"
    in: [pcc_final]
    out: [eligibility]
  - id: P2.02
    lane: P2
    kind: task
    title: Build concept blocks and term list
    exec: agent
    impl: exists
    skill: sr-search-design
    mode: terms
    run: "agsci board run src/scoping_review/board.yaml P2.02 --root <project>"
    in: [pcc_final, prior_reviews]
    out: [term_list]
  - id: P2.03
    lane: P2
    kind: task
    title: Assemble the seed set of known-relevant papers
    exec: ai+human
    impl: exists
    skill: sr-search-design
    mode: seeds
    run: "agsci board run src/scoping_review/board.yaml P2.03 --root <project>  # AI drafts; a person reviews, then agsci board done"
    in: [pcc_final]
    out: [seed_set]
  - id: P2.04
    lane: P2
    kind: task
    title: Draft the primary search strategy (one database)
    exec: agent
    impl: exists
    skill: sr-search-design
    mode: primary
    run: "agsci board run src/scoping_review/board.yaml P2.04 --root <project>"
    in: [term_list, eligibility]
    out: [search_strings]
  - id: P2.05
    lane: P2
    kind: loop
    title: Refine the primary strategy until PRESS-clean and seed recall met
    exec: ai+human
    impl: exists
    run: "agsci board start ... P2.05; run body P2.05a-c; agsci board iterate ... P2.05 --note <guard result> until the guard holds, then agsci board done ... P2.05"
    guard: "PRESS report has 0 'revision required' items and seed recall >= thresholds.seed_recall"
    bound: 3
    progress: "PRESS revision items + missed seeds"
    body: [P2.05a, P2.05b, P2.05c]
    in: [search_strings, seed_set, librarian_decision]
    out: [primary_strategy]
  - id: P2.05a
    parent: P2.05
    lane: P2
    kind: task
    title: Run test searches and measure seed recall
    exec: script
    impl: exists
    run: "agsci sr test-search --strategy review/search/primary.txt --source <primary source> --seeds review/seed_set.bib --out review/search/test_run.json"
    in: [search_strings, seed_set]
    out: [test_run]
  - id: P2.05b
    parent: P2.05
    lane: P2
    kind: task
    title: PRESS 2015 peer review of the search
    exec: ai+human
    impl: exists
    skill: sr-search-design
    mode: press
    run: "agsci board run src/scoping_review/board.yaml P2.05b --root <project>  # AI drafts; a person reviews, then agsci board done"
    in: [test_run, librarian_decision]
    out: [press_report]
  - id: P2.05c
    parent: P2.05
    lane: P2
    kind: task
    title: Revise search strings
    exec: agent
    impl: exists
    skill: sr-search-design
    mode: revise
    run: "agsci board run src/scoping_review/board.yaml P2.05c --root <project>"
    in: [press_report, test_run]
    out: [search_strings_rev]
  - id: P2.11
    lane: P2
    kind: task
    title: Translate the PRESS-reviewed strategy to every other source
    exec: agent
    impl: exists
    skill: sr-search-design
    mode: translate
    run: "agsci board run src/scoping_review/board.yaml P2.11 --root <project>"
    in: [primary_strategy, eligibility]
    out: [search_final]
  - id: P2.06
    lane: P2
    kind: task
    title: Draft the charting form
    exec: agent
    impl: exists
    skill: sr-protocol
    mode: charting-form
    run: "agsci board run src/scoping_review/board.yaml P2.06 --root <project>"
    in: [pcc_final, eligibility]
    out: [charting_form_v0]
  - id: P2.07
    lane: P2
    kind: task
    title: Specify the AI second reviewer (model, version, prompts, logging)
    exec: agent
    impl: exists
    skill: sr-protocol
    mode: ai-reviewer
    run: "agsci board run src/scoping_review/board.yaml P2.07 --root <project>"
    in: [eligibility]
    out: [ai_reviewer_spec]
  - id: P2.08
    lane: P2
    kind: task
    title: Write the protocol (JBI template)
    exec: agent
    impl: exists
    skill: sr-protocol
    mode: protocol
    run: "agsci board run src/scoping_review/board.yaml P2.08 --root <project>"
    in: [pcc_final, eligibility, search_final, charting_form_v0, ai_reviewer_spec, reporting_std, team]
    out: [protocol]
  - id: P2.09
    lane: P2
    kind: loop
    title: Internal protocol review
    exec: ai+human
    impl: exists
    run: "loop over P2.09a-b"
    guard: "review returns 0 major findings"
    bound: 3
    progress: "major findings"
    body: [P2.09a, P2.09b]
    in: [protocol]
    out: [protocol_reviewed]
  - id: P2.09a
    parent: P2.09
    lane: P2
    kind: task
    title: Adversarial protocol review
    exec: skill
    impl: exists
    run: "/scientific-reviewer --format=journal review/protocol.md"
    in: [protocol]
    out: [protocol_review]
  - id: P2.09b
    parent: P2.09
    lane: P2
    kind: task
    title: Fold review findings into the protocol
    exec: agent
    impl: exists
    skill: sr-fold
    mode: fold
    run: "agsci board run src/scoping_review/board.yaml P2.09b --root <project>"
    in: [protocol_review]
    out: [protocol_rev]
  - id: P2.10
    lane: P2
    kind: gate
    title: Protocol frozen
    exec: human
    impl: human
    run: "authors approve; agsci sr freeze review/protocol.md --ledger review/ledger.jsonl --node P2.10"
    approver: all authors
    criterion: "every author approves; hash recorded"
    in: [protocol_reviewed]
    out: [protocol_frozen]

  # ---------------------------------------------------------------- P3 Registration
  - id: P3.01
    lane: P3
    kind: decision
    title: Also publish the protocol in a journal?
    exec: human
    impl: human
    run: "record in review/decisions.yaml#P3.01"
    options: ["yes", "no"]
    criterion: "yes if the target journal expects a published protocol (e.g. JBI Evidence Synthesis) and the timeline allows it"
    in: [protocol_frozen, journal_profile]
    out: [protocol_pub_decision]
  - id: P3.02
    lane: P3
    kind: task
    title: Register the protocol on OSF Registries
    exec: human
    impl: human
    run: "OSF Registries, Generalized Systematic Review Registration form; record DOI in review/registration.yaml"
    in: [protocol_frozen]
    out: [osf_registration]
  - id: P3.03
    lane: P3
    kind: task
    title: Submit the protocol paper
    exec: human
    impl: human
    when: "P3.01 == yes"
    run: "submit review/protocol.md to the protocol venue; record ID in review/registration.yaml"
    in: [protocol_frozen, protocol_pub_decision]
    out: [protocol_submission]
  - id: P3.04
    lane: P3
    kind: task
    title: Open the deviations log
    exec: script
    impl: exists
    run: "agsci sr freeze review/protocol.md --ledger review/ledger.jsonl --node P3.04 && agsci sr freeze review/registration.yaml --ledger review/ledger.jsonl --node P3.04"
    in: [protocol_frozen, osf_registration]
    out: [deviations_log]

  # ---------------------------------------------------------------- P4 Search execution
  - id: P4.01
    lane: P4
    kind: task
    title: Run database searches with PRISMA-S log
    exec: script
    impl: exists
    run: "agsci sr search --strings review/search/ --out review/records/raw/ --log review/search_log.json (all 16 PRISMA-S items)  # ports mays/013 harvest_multisource.py + glp1_brca multi_source_search.py"
    in: [search_final, osf_registration]
    out: [raw_records, search_log]
  - id: P4.02
    lane: P4
    kind: decision
    title: Is grey literature in scope?
    exec: human
    impl: human
    run: "read protocol section 'Sources'; record in review/decisions.yaml#P4.02"
    options: ["yes", "no"]
    criterion: "as fixed in the frozen protocol"
    in: [protocol_frozen]
    out: [grey_decision]
  - id: P4.03
    lane: P4
    kind: task
    title: Search grey literature
    exec: ai+human
    impl: exists
    skill: sr-search-design
    mode: grey
    when: "P4.02 == yes"
    run: "agsci board run src/scoping_review/board.yaml P4.03 --root <project>  # AI drafts; a person reviews, then agsci board done"
    in: [search_final, grey_decision]
    out: [grey_records]
  - id: P4.04
    lane: P4
    kind: task
    title: Deduplicate records
    exec: script
    impl: exists
    run: "agsci sr dedup --in review/records/ --out review/records/dedup.json --log review/records/dedup_log.json"
    in: [raw_records, grey_records]
    optional: [grey_records]
    out: [records_dedup, dedup_log]
  - id: P4.05
    lane: P4
    kind: gate
    title: Deduplication spot-check
    exec: human
    impl: exists
    run: "agsci sr dedup-sample --log review/records/dedup_log.json --n 50 --out review/records/dedup_check.jsonl → human sets false_merge on every row (all version pairs first)"
    approver: lead reviewer
    criterion: "0 false merges in thresholds.dedup_check_pairs random merged pairs"
    in: [dedup_log]
    out: [dedup_ok]
  - id: P4.06
    lane: P4
    kind: decision
    title: Use active-learning prioritization for screening?
    exec: ai+human
    impl: human
    run: "record in review/decisions.yaml#P4.06"
    options: ["yes", "no"]
    criterion: "yes when records > thresholds.al_trigger_records; stop by SAFE: all seeds found, >= 2x estimated relevant prevalence and >= 10% screened, last 50 irrelevant, model switch, independent check of exclusions; disclose and log as a deviation if not in the protocol"
    in: [records_dedup, dedup_ok]
    out: [al_decision]

  # ---------------------------------------------------------------- P5 Title/abstract screening
  - id: P5.01
    lane: P5
    kind: task
    title: Write the screening guide with worked examples
    exec: agent
    impl: exists
    skill: sr-screen
    mode: guide
    run: "agsci board run src/scoping_review/board.yaml P5.01 --root <project>"
    in: [eligibility, protocol_frozen]
    out: [screening_guide]
  - id: P5.02
    lane: P5
    kind: loop
    title: Calibrate human and AI screeners on a pilot sample
    exec: ai+human
    impl: exists
    run: "agsci board start ... P5.02; run body P5.02a-e; agsci board iterate ... P5.02 --note <guard result> until the guard holds, then agsci board done ... P5.02"
    guard: "agreement >= thresholds.pilot_ta_agreement on thresholds.pilot_ta_sample records"
    bound: 3
    progress: "disagreements on the pilot sample"
    body: [P5.02a, P5.02b, P5.02c, P5.02d, P5.02e]
    in: [records_dedup, screening_guide, ai_reviewer_spec]
    out: [screening_guide_final, calibration_report]
  - id: P5.02a
    parent: P5.02
    lane: P5
    kind: task
    title: Draw a seeded random pilot sample
    exec: script
    impl: exists
    run: "agsci sr sample --in review/records/dedup.json --n 25 --seed <iteration> --out review/screen/pilot.json"
    in: [records_dedup]
    out: [pilot_sample]
  - id: P5.02b
    parent: P5.02
    lane: P5
    kind: task
    title: Human screens the pilot
    exec: human
    impl: exists
    run: "agsci sr sheet screen --in review/screen/pilot_{iter}.jsonl --out review/screen/human_pilot_{iter}.csv → fill → agsci sr sheet import-screen --sheet ... --stage pilot --screener <initials> --codes-from review/eligibility.md --out review/screen/human_pilot_{iter}.jsonl"
    in: [pilot_sample, screening_guide]
    out: [human_pilot]
  - id: P5.02c
    parent: P5.02
    lane: P5
    kind: task
    title: AI screens the pilot independently
    exec: agent
    impl: exists
    skill: sr-screen
    mode: screen
    run: "agsci board run src/scoping_review/board.yaml P5.02c --root <project>"
    in: [pilot_sample, screening_guide, ai_reviewer_spec]
    out: [ai_pilot]
  - id: P5.02d
    parent: P5.02
    lane: P5
    kind: task
    title: Compute agreement and Cohen's kappa
    exec: script
    impl: exists
    run: "agsci sr agreement --a review/screen/human_pilot.csv --b review/screen/ai_pilot.csv"
    in: [human_pilot, ai_pilot]
    out: [pilot_agreement]
  - id: P5.02e
    parent: P5.02
    lane: P5
    kind: task
    title: Refine guide and AI prompt (log any criteria change as a deviation)
    exec: ai+human
    impl: exists
    skill: sr-screen
    mode: refine
    run: "agsci board run src/scoping_review/board.yaml P5.02e --root <project>  # AI drafts; a person reviews, then agsci board done"
    in: [pilot_agreement]
    out: [guide_rev]
  - id: P5.03
    lane: P5
    kind: task
    title: AI screens all titles/abstracts (reason + quoted span)
    exec: agent
    impl: exists
    skill: sr-screen
    mode: screen
    run: "agsci board run src/scoping_review/board.yaml P5.03 --root <project>"
    in: [records_dedup, screening_guide_final, ai_reviewer_spec]
    out: [ai_ta]
  - id: P5.04
    lane: P5
    kind: task
    title: Human screens all titles/abstracts
    exec: human
    impl: exists
    run: "agsci sr sheet screen --in review/records/dedup.jsonl --out review/screen/human_ta.csv → fill (active-learning order + SAFE stop when P4.06 == yes) → agsci sr sheet import-screen --stage ta ... --out review/screen/human_ta.jsonl"
    in: [records_dedup, screening_guide_final, al_decision]
    out: [human_ta]
  - id: P5.05
    lane: P5
    kind: task
    title: Compare screeners, compute kappa, build conflict queue
    exec: script
    impl: exists
    run: "agsci sr agreement --a review/screen/human_ta.csv --b review/screen/ai_ta.csv --conflicts review/screen/ta_conflicts.csv"
    in: [ai_ta, human_ta]
    out: [ta_conflicts, ta_kappa]
  - id: P5.06
    lane: P5
    kind: task
    title: Adjudicate title/abstract conflicts
    exec: human
    impl: exists
    run: "agsci sr sheet adjudicate --in review/screen/ta_conflicts.jsonl --records review/records/dedup.jsonl --out review/screen/ta_adjudicate.csv → fill → agsci sr finalize --a review/screen/human_ta.jsonl --b review/screen/ai_ta.jsonl --adjudicated review/screen/ta_adjudicate.csv --stage ta --adjudicator <initials> --codes-from review/eligibility.md --out review/screen/ta_final.jsonl"
    in: [ta_conflicts]
    out: [ta_decisions]
  - id: P5.07
    lane: P5
    kind: gate
    title: Title/abstract screening complete
    exec: script
    impl: exists
    run: "agsci sr check-stage ta"
    approver: adjudicator
    criterion: "every record has a final decision, 0 unresolved conflicts, kappa recorded"
    in: [ta_decisions, ta_kappa, records_dedup]
    out: [ta_included]

  # ---------------------------------------------------------------- P6 Full-text screening
  - id: P6.01
    lane: P6
    kind: task
    title: Retrieve open-access full texts
    exec: script
    impl: exists
    run: "agsci sr fetch-fulltext --in review/screen/ta_included.jsonl --out review/fulltext/ --log review/fulltext/retrieval_log.json"
    in: [ta_included]
    out: [fulltext_oa, retrieval_log]
  - id: P6.02
    lane: P6
    kind: task
    title: Retrieve paywalled full texts (library / ILL)
    exec: human
    impl: human
    run: "work through review/fulltext/missing.csv; drop PDFs in review/fulltext/manual/"
    in: [retrieval_log]
    out: [fulltext_manual, not_retrieved]
  - id: P6.03
    lane: P6
    kind: task
    title: Convert PDFs to text
    exec: script
    impl: exists
    run: "gpu-run --class batch --mem 8192 --reason 'docling fulltext' -- agsci sr convert review/fulltext/ review/fulltext/manual/ --out review/fulltext_md/"
    in: [fulltext_oa, fulltext_manual]
    out: [fulltext_md]
  - id: P6.04
    lane: P6
    kind: task
    title: AI full-text screen (reason code + page-cited quote)
    exec: agent
    impl: exists
    skill: sr-screen
    mode: screen
    run: "agsci board run src/scoping_review/board.yaml P6.04 --root <project>"
    in: [fulltext_md, screening_guide_final, ai_reviewer_spec]
    out: [ai_ft]
  - id: P6.05
    lane: P6
    kind: task
    title: Human full-text screen
    exec: human
    impl: exists
    run: "agsci sr sheet screen --in review/screen/ta_included.jsonl --out review/screen/human_ft.csv → fill from the full texts → agsci sr sheet import-screen --stage ft ... --out review/screen/human_ft.jsonl"
    in: [fulltext_md, screening_guide_final]
    out: [human_ft]
  - id: P6.06
    lane: P6
    kind: task
    title: Compare full-text screeners, kappa, conflicts
    exec: script
    impl: exists
    run: "agsci sr agreement --a review/screen/human_ft.csv --b review/screen/ai_ft.csv --conflicts review/screen/ft_conflicts.csv"
    in: [ai_ft, human_ft]
    out: [ft_conflicts, ft_kappa]
  - id: P6.07
    lane: P6
    kind: task
    title: Adjudicate full-text conflicts
    exec: human
    impl: exists
    run: "agsci sr sheet adjudicate --in review/screen/ft_conflicts.jsonl ... → fill → agsci sr finalize --stage ft ... --out review/screen/ft_final.jsonl"
    in: [ft_conflicts]
    out: [ft_decisions]
  - id: P6.08
    lane: P6
    kind: loop
    title: Citation chasing (backward and forward)
    exec: ai+human
    impl: exists
    run: "agsci board start ... P6.08; run body P6.08a-d; agsci board iterate ... P6.08 --note <guard result> until the guard holds, then agsci board done ... P6.08"
    guard: "a round adds 0 newly included sources"
    bound: 3
    progress: "newly included sources per round"
    body: [P6.08a, P6.08b, P6.08c, P6.08d]
    in: [ft_decisions, records_dedup, screening_guide_final, ai_reviewer_spec]
    out: [chase_included, chase_log]
  - id: P6.08a
    parent: P6.08
    lane: P6
    kind: task
    title: Collect references and citing works of included sources
    exec: script
    impl: exists
    run: "agsci sr chase --included review/screen/ft_final.jsonl --out review/chase/candidates_{iter}.jsonl  (trace review/chase/candidates_{iter}.unresolved.txt by hand)"
    in: [ft_decisions]
    out: [chase_candidates]
  - id: P6.08b
    parent: P6.08
    lane: P6
    kind: task
    title: Deduplicate candidates against the corpus
    exec: script
    impl: exists
    run: "agsci sr dedup --against review/records/dedup.json --in review/chase/candidates.json"
    in: [chase_candidates, records_dedup]
    out: [chase_new]
  - id: P6.08c
    parent: P6.08
    lane: P6
    kind: task
    title: AI screens chased records (TA + FT)
    exec: agent
    impl: exists
    skill: sr-screen
    mode: screen
    run: "agsci board run src/scoping_review/board.yaml P6.08c --root <project>"
    in: [chase_new, screening_guide_final, ai_reviewer_spec]
    out: [chase_ai]
  - id: P6.08d
    parent: P6.08
    lane: P6
    kind: task
    title: Human screens and adjudicates chased records
    exec: human
    impl: exists
    run: "agsci sr sheet screen --in review/chase/new_{iter}.jsonl ... → import-screen --stage chase → agsci sr agreement + sheet adjudicate + finalize --stage chase --out review/chase/final_{iter}.jsonl"
    in: [chase_ai, chase_new]
    out: [chase_round]
  - id: P6.09
    lane: P6
    kind: gate
    title: Included set frozen; PRISMA counts balance
    exec: script
    impl: exists
    run: "agsci sr check-stage ft ... && agsci sr prisma --search-log review/search_log.json --dedup-log review/records/dedup_log.json --ta-report review/screen/ta_report.json --ft-report review/screen/ft_report.json --not-retrieved <n> --out review/prisma_counts.json"
    approver: adjudicator
    criterion: "identified - duplicates - excluded = included at every stage; every FT exclusion has a reason code"
    in: [ft_decisions, chase_included, chase_log, ta_included, not_retrieved, dedup_log, search_log]
    out: [included_final, prisma_counts]

  # ---------------------------------------------------------------- P7 Charting
  - id: P7.01
    lane: P7
    kind: loop
    title: Pilot the charting form
    exec: ai+human
    impl: exists
    run: "agsci board start ... P7.01; run body P7.01a-c; agsci board iterate ... P7.01 --note <guard result> until the guard holds, then agsci board done ... P7.01"
    guard: "human and AI agree on >= thresholds.pilot_chart_agreement of fields across thresholds.pilot_chart_sources sources per source type, and no field is ambiguous"
    bound: 3
    progress: "disagreeing fields"
    body: [P7.01a, P7.01b, P7.01c]
    in: [charting_form_v0, included_final, fulltext_md]
    out: [charting_form_final]
  - id: P7.01a
    parent: P7.01
    lane: P7
    kind: task
    title: Human and AI chart the pilot sources independently
    exec: ai+human
    impl: exists
    skill: sr-chart
    mode: chart
    run: "agsci board run src/scoping_review/board.yaml P7.01a --root <project>  # AI drafts; a person reviews, then agsci board done"
    in: [charting_form_v0, included_final, fulltext_md]
    out: [chart_pilot]
  - id: P7.01b
    parent: P7.01
    lane: P7
    kind: task
    title: Compare field-level agreement
    exec: script
    impl: exists
    run: "agsci sr chart-agreement --a review/chart/pilot_{iter}/human.jsonl --b review/chart/pilot_{iter}/ai.jsonl --out review/chart/pilot_agreement_{iter}.json"
    in: [chart_pilot]
    out: [chart_pilot_agreement]
  - id: P7.01c
    parent: P7.01
    lane: P7
    kind: task
    title: Revise the charting form
    exec: ai+human
    impl: exists
    skill: sr-protocol
    mode: revise-form
    run: "agsci board run src/scoping_review/board.yaml P7.01c --root <project>  # AI drafts; a person reviews, then agsci board done"
    in: [chart_pilot_agreement]
    out: [charting_form_rev]
  - id: P7.02
    lane: P7
    kind: task
    title: AI charts every included source (quote + page per field)
    exec: agent
    impl: exists
    skill: sr-chart
    mode: chart
    run: "agsci board run src/scoping_review/board.yaml P7.02 --root <project>"
    in: [included_final, fulltext_md, charting_form_final]
    out: [ai_chart]
  - id: P7.03
    lane: P7
    kind: task
    title: Human verifies every charted field against its quote
    exec: human
    impl: exists
    run: "agsci sr sheet verify --in review/chart/ai.jsonl --out review/chart/verify.csv → mark every field accept/correct/not_reported → agsci sr sheet import-verify --in review/chart/ai.jsonl --sheet review/chart/verify.csv --verifier <initials> --out review/chart/verified.jsonl"
    in: [ai_chart]
    out: [chart_verified]
  - id: P7.04
    lane: P7
    kind: decision
    title: Appraise source quality?
    exec: human
    impl: human
    run: "read protocol; record in review/decisions.yaml#P7.04"
    options: ["no", "yes"]
    criterion: "default no: JBI 10.2.8 does not advocate appraisal in scoping reviews; yes only if a funder requires it, reported descriptively and never used for recommendations"
    in: [protocol_frozen]
    out: [appraisal_decision]
  - id: P7.05
    lane: P7
    kind: task
    title: Critical appraisal with a named tool
    exec: ai+human
    impl: exists
    skill: sr-chart
    mode: appraise
    when: "P7.04 == yes"
    run: "agsci board run src/scoping_review/board.yaml P7.05 --root <project>  # AI drafts; a person reviews, then agsci board done"
    in: [chart_verified, appraisal_decision]
    out: [appraisal]
  - id: P7.06
    lane: P7
    kind: decision
    title: Run a stakeholder consultation (Arksey and O'Malley stage 6)?
    exec: human
    impl: human
    run: "record in review/decisions.yaml#P7.06"
    options: ["no", "yes"]
    criterion: "as fixed in the protocol: optional under Arksey and O'Malley 2005, required under Levac et al. 2010; declare which framework applies"
    in: [protocol_frozen]
    out: [consult_decision]
  - id: P7.07
    lane: P7
    kind: decision
    title: Does the consultation need ethics (IRB) approval?
    exec: human
    impl: human
    when: "P7.06 == yes"
    run: "ask the institutional IRB office; record in review/decisions.yaml#P7.07"
    options: ["yes", "no"]
    criterion: "yes if consultation data about people will be collected and reported"
    in: [consult_decision]
    out: [irb_decision]
  - id: P7.08
    lane: P7
    kind: task
    title: Obtain IRB approval
    exec: human
    impl: human
    when: "P7.07 == yes"
    run: "submit to the IRB; store approval letter in review/ethics/"
    in: [irb_decision]
    out: [irb_approval]
  - id: P7.09
    lane: P7
    kind: task
    title: Run the consultation
    exec: human
    impl: human
    when: "P7.06 == yes"
    run: "present preliminary map to stakeholders; record notes in review/consultation.md"
    in: [chart_verified, consult_decision, irb_approval]
    optional: [irb_approval]
    out: [consult_notes]
  - id: P7.10
    lane: P7
    kind: gate
    title: Charting dataset frozen
    exec: script
    impl: exists
    run: "agsci sr freeze review/chart/verified.jsonl --ledger review/ledger.jsonl --node P7.10"
    approver: lead reviewer
    criterion: "100% of fields human-verified; deviations logged; hash recorded"
    in: [chart_verified, appraisal, deviations_log]
    optional: [appraisal]
    out: [chart_frozen]

  # ---------------------------------------------------------------- P8 Synthesis and visualization
  - id: P8.01
    lane: P8
    kind: task
    title: Descriptive statistics
    exec: script
    impl: exists
    run: "agsci sr describe --in review/chart/frozen.jsonl --fields <charting form field ids> --out review/synthesis/stats.json"
    in: [chart_frozen]
    out: [stats]
  - id: P8.02
    lane: P8
    kind: task
    title: Build the content-analysis codebook
    exec: ai+human
    impl: exists
    skill: sr-synthesize
    mode: codebook
    run: "agsci board run src/scoping_review/board.yaml P8.02 --root <project>  # AI drafts; a person reviews, then agsci board done"
    in: [chart_frozen]
    out: [codebook]
  - id: P8.03
    lane: P8
    kind: task
    title: Apply codes to every source with quotes
    exec: agent
    impl: exists
    skill: sr-synthesize
    mode: code
    run: "agsci board run src/scoping_review/board.yaml P8.03 --root <project>"
    in: [chart_frozen, codebook]
    out: [coded]
  - id: P8.04
    lane: P8
    kind: task
    title: Human verifies coding
    exec: human
    impl: exists
    run: "agsci sr sheet verify --in review/synthesis/coded.jsonl ... → import-verify --verifier <initials> --out review/synthesis/coded_verified.jsonl"
    in: [coded]
    out: [coded_verified]
  - id: P8.05
    lane: P8
    kind: task
    title: Build the evidence gap map matrix
    exec: script
    impl: exists
    run: "agsci sr gap-map --in review/synthesis/coded_verified.jsonl --rows <field> --cols <field> --out review/synthesis/gap_map.json"
