# PRISMA-ScR checklist (Tricco AC et al. Ann Intern Med 2018;169:467-473).
# Item wording copied from the official checklist as reproduced in Lohmann et al. 2022
# (LSHTM eprints 4665736, completed PRISMA-ScR checklist), retrieved 2026-10-16.
# 22 items; 12 and 16 are "if done". An update is in development (Tricco et al. 2026,
# J Clin Epidemiol 196:112314); use the version current at submission.
name: PRISMA-ScR
version: "2018"
items:
  - {n: 1, section: Title, name: Title, text: "Identify the report as a scoping review."}
  - {n: 2, section: Abstract, name: Structured summary, text: "Provide a structured summary that includes (as applicable): background, objectives, eligibility criteria, sources of evidence, charting methods, results, and conclusions that relate to the review questions and objectives."}
  - {n: 3, section: Introduction, name: Rationale, text: "Describe the rationale for the review in the context of what is already known. Explain why the review questions/objectives lend themselves to a scoping review approach."}
  - {n: 4, section: Introduction, name: Objectives, text: "Provide an explicit statement of the questions and objectives being addressed with reference to their key elements (e.g., population or participants, concepts, and context) or other relevant key elements used to conceptualize the review questions and/or objectives."}
  - {n: 5, section: Methods, name: Protocol and registration, text: "Indicate whether a review protocol exists; state if and where it can be accessed (e.g., a Web address); and if available, provide registration information, including the registration number."}
  - {n: 6, section: Methods, name: Eligibility criteria, text: "Specify characteristics of the sources of evidence used as eligibility criteria (e.g., years considered, language, and publication status), and provide a rationale."}
  - {n: 7, section: Methods, name: Information sources, text: "Describe all information sources in the search (e.g., databases with dates of coverage and contact with authors to identify additional sources), as well as the date the most recent search was executed."}
  - {n: 8, section: Methods, name: Search, text: "Present the full electronic search strategy for at least 1 database, including any limits used, such that it could be repeated."}
  - {n: 9, section: Methods, name: Selection of sources of evidence, text: "State the process for selecting sources of evidence (i.e., screening and eligibility) included in the scoping review."}
  - {n: 10, section: Methods, name: Data charting process, text: "Describe the methods of charting data from the included sources of evidence (e.g., calibrated forms or forms that have been tested by the team before their use, and whether data charting was done independently or in duplicate) and any processes for obtaining and confirming data from investigators."}
  - {n: 11, section: Methods, name: Data items, text: "List and define all variables for which data were sought and any assumptions and simplifications made."}
  - {n: 12, section: Methods, name: Critical appraisal of individual sources of evidence, if_done: true, text: "If done, provide a rationale for conducting a critical appraisal of included sources of evidence; describe the methods used and how this information was used in any data synthesis (if appropriate)."}
  - {n: 13, section: Methods, name: Synthesis of results, text: "Describe the methods of handling and summarizing the data that were charted."}
  - {n: 14, section: Results, name: Selection of sources of evidence, text: "Give numbers of sources of evidence screened, assessed for eligibility, and included in the review, with reasons for exclusions at each stage, ideally using a flow diagram."}
  - {n: 15, section: Results, name: Characteristics of sources of evidence, text: "For each source of evidence, present characteristics for which data were charted and provide the citations."}
  - {n: 16, section: Results, name: Critical appraisal within sources of evidence, if_done: true, text: "If done, present data on critical appraisal of included sources of evidence (see item 12)."}
  - {n: 17, section: Results, name: Results of individual sources of evidence, text: "For each included source of evidence, present the relevant data that were charted that relate to the review questions and objectives."}
  - {n: 18, section: Results, name: Synthesis of results, text: "Summarize and/or present the charting results as they relate to the review questions and objectives."}
  - {n: 19, section: Discussion, name: Summary of evidence, text: "Summarize the main results (including an overview of concepts, themes, and types of evidence available), link to the review questions and objectives, and consider the relevance to key groups."}
  - {n: 20, section: Discussion, name: Limitations, text: "Discuss the limitations of the scoping review process."}
  - {n: 21, section: Discussion, name: Conclusions, text: "Provide a general interpretation of the results with respect to the review questions and objectives, as well as potential implications and/or next steps."}
  - {n: 22, section: Funding, name: Funding, text: "Describe sources of funding for the included sources of evidence, as well as sources of funding for the scoping review. Describe the role of the funders of the scoping review."}
